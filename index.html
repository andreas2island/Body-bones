      for (var k = 0; k < vp.length; k++){
        var poly = L.polygon(vp[k], HIDDEN_STYLE);
        poly.__boneId = b.id;
        poly.__sideIdx = k;
        poly.on("click", onPolyClickRef);
        poly.addTo(map);
        arr.push(poly);
      }
      layersById[b.id] = arr;
    }
    addTapTargets();

  }

  // Polygon hit areas scale with the map, so at the default whole-body zoom every
  // bone is a few CSS pixels across — far below a fingertip. These markers give
  // each bone (each side of a paired bone) a target whose radius is in SCREEN
  // pixels, so it stays finger-sized at any zoom. Added after the polygons and
  // largest-bone-first, so small bones sit on top and stay reachable.
  var tapTargets = [];

  function ringCentre(ring){
    var mny = Infinity, mxy = -Infinity, mnx = Infinity, mxx = -Infinity;
    for (var i = 0; i < ring.length; i++){
      if (ring[i][0] < mny){ mny = ring[i][0]; }
      if (ring[i][0] > mxy){ mxy = ring[i][0]; }
      if (ring[i][1] < mnx){ mnx = ring[i][1]; }
      if (ring[i][1] > mxx){ mxx = ring[i][1]; }
    }
    return [(mny + mxy) / 2, (mnx + mxx) / 2];
  }

  // Called from a sort comparator over 219 bones: without a cache that is
  // ~3400 recomputations across every ring on every view switch.
  function polyArea(b){
    if (!b.__areaCache){ b.__areaCache = {}; }
    if (b.__areaCache[view] !== undefined){ return b.__areaCache[view]; }
    var VP = vPolys(b), a = 0;
    for (var i = 0; i < VP.length; i++){
      var r = ringCentre(VP[i]);
      var mny = Infinity, mxy = -Infinity, mnx = Infinity, mxx = -Infinity;
      for (var j = 0; j < VP[i].length; j++){
        if (VP[i][j][0] < mny){ mny = VP[i][j][0]; }
        if (VP[i][j][0] > mxy){ mxy = VP[i][j][0]; }
        if (VP[i][j][1] < mnx){ mnx = VP[i][j][1]; }
        if (VP[i][j][1] > mxx){ mxx = VP[i][j][1]; }
      }
      a += (mxy - mny) * (mxx - mnx);
    }
    b.__areaCache[view] = a;
    return a;
  }

  // Select the bone whose target centre is nearest the finger, measured in SCREEN
  // pixels so it behaves the same at every zoom. This is what makes small,
  // tightly packed bones (phalanges, carpals) reachable: they no longer have to
  // win an overlap fight, they just have to be the closest thing to the tap.
  // Set to true to see hit detection: outlines, ids, areas, tap coordinates and
  // which target won. One constant, nothing else to change.
  var DEBUG_HITS = false;

  var TOUCH_PX = 44;   // Android minimum touch target

  // Hit resolution, in priority order:
  //   1. the tap lands INSIDE a bone's own outline  -> that bone wins
  //   2. inside several overlapping outlines        -> the SMALLEST bone wins
  //   3. inside none                                -> nearest tap point within
  //      one finger-width, so small bones need no pixel-perfect aim
  // Proximity alone must never override containment: an earlier version let the
  // smallest bone within 44px win, and the pisiform then swallowed the wrist.
  // Ray casting on the real outline. Bounding boxes could never separate two
  // angled neighbours - a box around a diagonal finger bone covers half of the
  // bone beside it, which is what let neighbours steal touches.
  function pointInRing(y, x, ring){
    var inside = false;
    for (var i = 0, j = ring.length - 1; i < ring.length; j = i++){
      var yi = ring[i][0], xi = ring[i][1], yj = ring[j][0], xj = ring[j][1];
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)){
        inside = !inside;
      }
    }
    return inside;
  }

  function ringArea(ring){
    var a = 0;
    for (var i = 0; i < ring.length; i++){
      var p1 = ring[i], p2 = ring[(i + 1) % ring.length];
      a += p1[1] * p2[0] - p2[1] * p1[0];
    }
    return Math.abs(a) / 2;
  }

  function containersAt(y, x){
    var out = [];
    for (var i = 0; i < BONES.length; i++){
      var b = BONES[i], VP = vPolys(b);
      for (var j = 0; j < VP.length; j++){
        var ring = VP[j], hitIt;
        if (vTrueOutline(b)){ hitIt = pointInRing(y, x, ring); }
        else {
          var mny = Infinity, mxy = -Infinity, mnx = Infinity, mxx = -Infinity;
          for (var q = 0; q < ring.length; q++){
            if (ring[q][0] < mny){ mny = ring[q][0]; }
            if (ring[q][0] > mxy){ mxy = ring[q][0]; }
            if (ring[q][1] < mnx){ mnx = ring[q][1]; }
            if (ring[q][1] > mxx){ mxx = ring[q][1]; }
          }
          hitIt = (y >= mny && y <= mxy && x >= mnx && x <= mxx);
        }
        if (hitIt){ out.push({ id: b.id, side: j, area: ringArea(ring) }); break; }
      }
    }
    out.sort(function(p2, q2){ return p2.area - q2.area; });
    return out;
  }

  function nearestTarget(latlng){
    if (!map){ return null; }
    var inside = containersAt(latlng.lat, latlng.lng);
    var win = inside.length ? inside[0] : null;
    var within = [];
    if (!win && tapTargets.length){
      var p0 = map.latLngToContainerPoint(latlng), best = null, bd = Infinity;
      for (var i = 0; i < tapTargets.length; i++){
        var q = map.latLngToContainerPoint(L.latLng(tapTargets[i].latlng));
        var dx = q.x - p0.x, dy = q.y - p0.y, d = Math.sqrt(dx * dx + dy * dy);
        tapTargets[i]._d = d;
        if (d <= TOUCH_PX){ within.push(tapTargets[i]); }
        if (d < bd){ bd = d; best = tapTargets[i]; }
      }
      if (within.length){
        within.sort(function(a2, b2){ return a2._d - b2._d; });
        win = within[0];
      } else if (best && bd <= TOUCH_PX * 1.6){ win = best; }
    }
    if (DEBUG_HITS){ debugReport(map.latLngToContainerPoint(latlng), latlng, inside.length ? inside : within, win); }
    return win;
  }

  function debugReport(p, latlng, within, win){
    var el = document.getElementById("dbg-panel");
    if (!el){
      el = document.createElement("div");
      el.id = "dbg-panel";
      el.style.cssText = "position:absolute;left:6px;bottom:6px;z-index:9999;max-width:92%;" +
        "background:rgba(0,0,0,.82);color:#0f0;font:11px/1.35 monospace;padding:8px;border-radius:6px;";
      document.getElementById("map").appendChild(el);
    }
    var rows = ["screen " + Math.round(p.x) + "," + Math.round(p.y) +
                "   image y" + Math.round(latlng.lat) + " x" + Math.round(latlng.lng),
                "candidates: " + within.length];
    for (var i = 0; i < within.length && i < 6; i++){
      rows.push((within[i] === win ? "> " : "  ") + within[i].id +
                (within[i]._d !== undefined ? "  d=" + within[i]._d.toFixed(1) : "  (contains tap)") +
                "  area=" + (within[i].area || "?") + "  band=" + within[i].side);
    }
    rows.push("WON: " + (win ? win.id : "(none - selection cleared)"));
    el.textContent = rows.join("\n");
  }

  function clearTapTargets(){
    tapTargets = [];
  }

  var tapTargetsByView = {};

  function addTapTargets(){
    clearTapTargets();
    if (!map){ return; }
    // The target set depends only on the polygon data for this view, which never
    // changes at runtime — compute it once per view, reuse on every switch back.
    if (tapTargetsByView[view]){ tapTargets = tapTargetsByView[view]; return; }
    var list = [];
    for (var i = 0; i < BONES.length; i++){
      if (vPolys(BONES[i]).length){ list.push(BONES[i]); }
    }
    list.sort(function(p, q){ return polyArea(q) - polyArea(p); });   // small bones last = on top
    for (i = 0; i < list.length; i++){
      var b = list[i], VP = vPolys(b), k;
      // Precise tap points, one per real bone region, computed at build time from
      // the vector outlines. Only the front plate has them; the back falls back
      // to the connected-component method below.
      var TP = vTaps(b);
      var TA = vTapArea(b);
      if (TP && TP.length){
        for (k = 0; k < TP.length; k++){
          var tp = TP[k], bandIdx = 0;
          for (var bi = 0; bi < VP.length; bi++){
            var yy = [], xx = [];
            for (var bj = 0; bj < VP[bi].length; bj++){ yy.push(VP[bi][bj][0]); xx.push(VP[bi][bj][1]); }
            if (tp[0] >= Math.min.apply(null, yy) && tp[0] <= Math.max.apply(null, yy) &&
                tp[1] >= Math.min.apply(null, xx) && tp[1] <= Math.max.apply(null, xx)){
              bandIdx = bi; break;
            }
          }
          tapTargets.push({ latlng: [tp[0], tp[1]], id: b.id, side: bandIdx,
                            area: (TA && TA[k]) || null });
        }
        continue;
      }

      // One target per CONTIGUOUS BONE SEGMENT. The previous version spaced
      // targets 40px apart down each finger, which skipped the distal phalanx
      // entirely - it is only ~24px long. Grouping the bands into connected
      // components gives exactly one target per finger segment, whatever its size.
      var boxes = [];
      for (k = 0; k < VP.length; k++){
        var mny = Infinity, mxy = -Infinity, mnx = Infinity, mxx = -Infinity;
        for (var j = 0; j < VP[k].length; j++){
          if (VP[k][j][0] < mny){ mny = VP[k][j][0]; }
          if (VP[k][j][0] > mxy){ mxy = VP[k][j][0]; }
          if (VP[k][j][1] < mnx){ mnx = VP[k][j][1]; }
          if (VP[k][j][1] > mxx){ mxx = VP[k][j][1]; }
        }
        boxes.push({ y0:mny, y1:mxy, x0:mnx, x1:mxx, i:k });
      }
      var par = [];
      for (k = 0; k < boxes.length; k++){ par.push(k); }
      function find(x){ while (par[x] !== x){ par[x] = par[par[x]]; x = par[x]; } return x; }
      for (k = 0; k < boxes.length; k++){
        for (var q = k + 1; q < boxes.length; q++){
          var A = boxes[k], C = boxes[q];
          var xover = Math.min(A.x1, C.x1) - Math.max(A.x0, C.x0);
          var ygap  = Math.max(0, Math.max(A.y0, C.y0) - Math.min(A.y1, C.y1));
          var narrow = Math.min(A.x1 - A.x0, C.x1 - C.x0);
          // Adjacent fingers are angled and their bands clip each other, so ANY
          // overlap would fuse two fingers into one segment. Require a real one.
          if (xover > 0.45 * narrow && ygap <= 6){
            var ra = find(k), rc = find(q);
            if (ra !== rc){ par[rc] = ra; }
          }
        }
      }
      var comp = {};
      for (k = 0; k < boxes.length; k++){
        var root = find(k);
        if (!comp[root]){ comp[root] = []; }
        comp[root].push(boxes[k]);
      }
      for (var ck in comp){
        if (!Object.prototype.hasOwnProperty.call(comp, ck)){ continue; }
        var seg = comp[ck];
        seg.sort(function(p2, q2){ return p2.y0 - q2.y0; });
        var mid = seg[Math.floor(seg.length / 2)];
        var segArea = 0;
        for (var si = 0; si < seg.length; si++){
          segArea += (seg[si].y1 - seg[si].y0) * (seg[si].x1 - seg[si].x0);
        }
        tapTargets.push({ latlng: [(mid.y0 + mid.y1) / 2, (mid.x0 + mid.x1) / 2],
                          id: b.id, side: mid.i, area: segArea });
      }
    }
    tapTargetsByView[view] = tapTargets;
  }

  // Each view gets its OWN renderer, so switching is add/remove of one renderer
  // instead of destroying and re-constructing ~300 L.polygon objects. The
  // inactive renderer is removed from the map (not just hidden) so it costs
  // nothing during pan and zoom.
  var renderersByView = {};
  var layersByViewCache = {};

  function rendererFor(v){
    if (!renderersByView[v]){ renderersByView[v] = L.svg({ padding: 0.2 }); }
    return renderersByView[v];
  }

  function makeLayersFor(v){
    var r = rendererFor(v);
    var out = {};
    var byDepth = BONES.slice().sort(function(p, q){
      return (p.z === undefined ? 2 : p.z) - (q.z === undefined ? 2 : q.z);
    });
    for (var i = 0; i < byDepth.length; i++){
      var b = byDepth[i];
      var vp;
      if (v === "footD" || v === "footL"){
        vp = (FOOTV[v === "footL" ? "lateral" : "dorsal"] || { polys:{} }).polys[b.id] || [];
      } else {
        vp = (v === "back") ? (b.polysB || []) : (b.polys || []);
      }
      if (!vp.length){ continue; }
      var arr2 = [];
      for (var k = 0; k < vp.length; k++){
        var opt = { renderer: r };
        for (var key in HIDDEN_STYLE){
          if (Object.prototype.hasOwnProperty.call(HIDDEN_STYLE, key)){ opt[key] = HIDDEN_STYLE[key]; }
        }
        var poly = L.polygon(vp[k], opt);
        poly.__boneId = b.id;
        poly.__sideIdx = k;
        poly.on("click", onPolyClickRef);
        arr2.push(poly);
      }
      out[b.id] = arr2;
    }
    return out;
  }

  function setRendererActive(v, on){
    var r = renderersByView[v];
    if (!r){ return; }
    var has = map.hasLayer(r);
    if (on && !has){ map.addLayer(r); }
    if (!on && has){ map.removeLayer(r); }
  }

  function buildPolyLayers(){
    if (!map){ return; }
    var v;
    if (!layersByViewCache[view]){
      layersByViewCache[view] = makeLayersFor(view);
      var made = layersByViewCache[view], id2;
      map.addLayer(rendererFor(view));
      for (id2 in made){
        if (!Object.prototype.hasOwnProperty.call(made, id2)){ continue; }
        for (var q = 0; q < made[id2].length; q++){ made[id2][q].addTo(map); }
      }
    }
    for (v in renderersByView){
      if (Object.prototype.hasOwnProperty.call(renderersByView, v)){ setRendererActive(v, v === view); }
    }
    layersById = layersByViewCache[view];
    addTapTargets();
  }

  var switching = false;
  // The round toggle cycles WITHIN the current mode; the foot button switches
  // mode. Two controls beat one four-state cycle: reaching BACK stays one tap.
  function toggleView(){
    if (view === "footD"){ switchView("footL"); return; }
    if (view === "footL"){ switchView("footD"); return; }
    switchView(view === "front" ? "back" : "front");
  }
  var lastBodyView = "front";
  function toggleFoot(){
    if (isFootView()){ switchView(lastBodyView); return; }
    lastBodyView = view;
    switchView("footD");
  }
  function paintFootToggle(){
    var fb = document.getElementById("foot-toggle");
    if (!fb){ return; }
    fb.querySelector(".vt-label").textContent = t(isFootView() ? "view.body" : "view.foot");
    fb.className = isFootView() ? "on" : "";
  }

  function switchView(v){
    if (v === view || !map || switching){ return; }   // a second tap mid-switch queued a whole rebuild
    switching = true;
    view = v;
    if (skeletonLayer){
      skeletonLayer.setUrl(viewImage());
      if (skeletonLayer.setBounds){ skeletonLayer.setBounds(L.latLngBounds(vBounds())); }
    }
    // a bone that isn't visible from this side can't stay selected
    var keep = selectedId;
    if (keep && !vPolys(byId[keep]).length){ selectedId = null; selectedSide = 0; }
    buildPolyLayers();
    map.fitBounds(vBounds(), { animate: false });   // animating a full-plate refit stutters on old WebKit
    if (selectedId){ applyStyle(selectedId); } else { updatePin(); }
    renderStrip();
    var btn = document.getElementById("view-toggle");
    if (btn){ btn.querySelector(".vt-label").textContent = t(viewLabelKey()); }
    if (quiz){ endQuiz(); }
    paintFootToggle();
    var fn = document.getElementById("foot-note");
    if (fn){ fn.className = isFootView() ? "show" : ""; }
    switching = false;
  }

  function flyToBone(id){
    var b = byId[id];
    if (!b || !map){ return; }
    var VP = vPolys(b);
    if (!VP.length){ return; }
    var all = [];
    for (var i = 0; i < VP.length; i++){
      for (var j = 0; j < VP[i].length; j++){ all.push(VP[i][j]); }
    }
    try { map.fitBounds(L.latLngBounds(all).pad(1.6)); } catch (e) { /* ignore */ }
  }

  // Quiz framing differs from search: the answer panel covers the lower part of
  // the map, and a lone bone with no context is hard to place on the body. Show
  // the bone with generous surrounding context and bias it toward the visible
  // TOP of the map window (paddingBottomRight pushes the fit up, away from the panel).
  function frameQuizBone(id){
    var b = byId[id];
    if (!b || !map){ return; }
    var VP = vPolys(b);
    if (!VP.length){ return; }

    // Frame every band on the highlighted side. Fitting all sides of a paired
    // bone would centre on the empty midline between them.
    var all = [];
    var pick = litBands(b);
    for (var i = 0; i < pick.length; i++){
      for (var j = 0; j < pick[i].length; j++){ all.push(pick[i][j]); }
    }
    if (!all.length){
      for (i = 0; i < VP.length; i++){
        for (j = 0; j < VP[i].length; j++){ all.push(VP[i][j]); }
      }
    }

    try {
      var bounds = L.latLngBounds(all);
      var mapH = map.getSize().y || 300;
      var reserve = Math.round(mapH * 0.55);
      if (reserve > mapH - 80){ reserve = Math.max(0, mapH - 80); }
      map.fitBounds(bounds.pad(1.4), {
        paddingTopLeft: [10, 10],
        paddingBottomRight: [10, reserve],
        animate: false,
        maxZoom: 2
      });
      if (map.getZoom() <= -1.5){ map.setView(bounds.getCenter(), 0, { animate:false }); }
    } catch (e) { /* ignore */ }
  }

  // ---------- BONE PAGE ----------
  function sectionTitle(t){
    var h = document.createElement("div");
    h.className = "sec-title";
    h.textContent = t;
    return h;
  }

  function openBone(id){
    var b = byId[id];
    if (!b){ return; }
    selectBone(id);

    if (!studied[id]){ studied[id] = 1; saveStudied(); }

    var nm = names(b);
    var h1 = document.getElementById("bone-sv");
    var p2 = document.getElementById("bone-la");
    h1.textContent = nm.first;
    h1.style.fontStyle = nm.firstIsLatin ? "italic" : "normal";
    p2.textContent = nm.second;
    p2.style.fontStyle = nm.secondIsLatin ? "italic" : "normal";
    document.getElementById("bone-en").textContent = nm.third;

    var chips = [];
    chips.push(regionName(b.region));
    if (b.partOf){
      chips.push(t("bone.chip.partof") + (byId[b.partOf] ? byId[b.partOf][settings.primary === "en" ? "en" : "sv"].toLowerCase() : b.partOf));
    } else {
      chips.push(t("bone.chip.count", { n:b.count }));
    }
    chips.push(t(b.side === "paired" ? "bone.chip.paired" : "bone.chip.single"));

    var ch = document.getElementById("bone-chips");
    ch.innerHTML = "";
    for (var c = 0; c < chips.length; c++){
      var sp = document.createElement("span");
      sp.className = "chip";
      sp.textContent = chips[c];
      ch.appendChild(sp);
    }

    var body = document.getElementById("bone-body");
    body.innerHTML = "";

    var facts = factList(b);
    if (facts.length){
      body.appendChild(sectionTitle(t("bone.overview")));
      for (var f = 0; f < facts.length; f++){
        var p = document.createElement("p");
        p.className = "fact";
        p.textContent = facts[f];
        body.appendChild(p);
      }
    }
    if (b.landmarks && b.landmarks.length){
      body.appendChild(sectionTitle(t("bone.landmarks")));
      for (var l = 0; l < b.landmarks.length; l++){
        var sp2 = document.createElement("span");
        sp2.className = "lm";
        sp2.textContent = b.landmarks[l];
        body.appendChild(sp2);
      }
    }
    if (!b.shown){
      var n = document.createElement("p");
      n.className = "note";
      n.textContent = t("bone.note.hidden");
      body.appendChild(n);
    }
    if (placementUnverified(b)){
      var u = document.createElement("p");
      u.className = "note";
      u.textContent = t("bone.note.unverified");
      body.appendChild(u);
    }
    var d = document.createElement("p");
    d.className = "note";
    d.textContent = t("bone.note.schematic");
    body.appendChild(d);
    document.getElementById("bone-empty").style.display = "none";
    document.getElementById("bone-content").style.display = "flex";
  }

  // ---------- SEARCH ----------
  function norm(s){
    s = (s || "").toLowerCase();
    s = s.replace(/\u00e5/g, "a").replace(/\u00e4/g, "a").replace(/\u00f6/g, "o");
    s = s.replace(/\u00e9/g, "e");
    return s;
  }

  function resultItem(b){
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "res-item";
    var d1 = document.createElement("div");
    d1.className = "res-sv";
    var rn = names(b);
    d1.textContent = rn.first;
    d1.style.fontStyle = rn.firstIsLatin ? "italic" : "normal";
    var d2 = document.createElement("div");
    d2.className = "res-la";
    d2.textContent = rn.second + " \u00b7 " + rn.third;
    d2.style.fontStyle = rn.secondIsLatin ? "italic" : "normal";
    btn.appendChild(d1);
    btn.appendChild(d2);
    if (!b.shown){
      var d3 = document.createElement("div");
      d3.className = "res-flag";
      d3.textContent = t("search.flag.hidden");
      btn.appendChild(d3);
    }
    btn.addEventListener("click", function(){
      document.getElementById("search-input").value = "";
      runSearch("");
      if (b.shown){ flyToBone(b.id); }
      openBone(b.id);
      goToPage("page-bone");
    });
    return btn;
  }

  function runSearch(q){
    var res = document.getElementById("search-results");
    var mapEl = document.getElementById("atlas-map");
    var strip = document.getElementById("sel-strip");
    var nq = norm(q).replace(/^\s+|\s+$/g, "");

    if (!nq){
      res.className = "";
      res.innerHTML = "";
      mapEl.style.display = "";
      renderStrip();
      if (map){ window.setTimeout(function(){ map.invalidateSize(); }, 0); }
      return;
    }

    var hits = [];
    for (var i = 0; i < BONES.length; i++){
      var b = BONES[i];
      if (norm(b.sv).indexOf(nq) >= 0 || norm(b.la).indexOf(nq) >= 0 ||
          norm(b.en).indexOf(nq) >= 0){
        hits.push(b);
      }
    }

    res.innerHTML = "";
    if (!hits.length){
      var e = document.createElement("div");
      e.className = "empty-state";
      var s1 = document.createElement("strong");
      s1.textContent = t("search.nohit.title");
      e.appendChild(s1);
      e.appendChild(document.createTextNode(t("search.nohit.body")));
      res.appendChild(e);
    }
    for (var h = 0; h < hits.length; h++){
      res.appendChild(resultItem(hits[h]));
    }
    mapEl.style.display = "none";
    strip.className = "";
    res.className = "show";
  }

  // Swedish alphabetical order puts å ä ö AFTER z; raw code points order
  // them ä < å < ö, which is wrong. Map to sort keys instead.
  function svKey(t){
    return (t || "").toLowerCase()
      .replace(/\u00e5/g, "z1").replace(/\u00e4/g, "z2").replace(/\u00f6/g, "z3");
  }

  // ---------- MINA ----------
  // ---------- BROWSE BY REGION ----------
  // Superior -> inferior, matching the order regions are taught in.
  var REGION_ORDER = ["skull","neck","spine","thorax","shoulder","arm","hand","pelvis","leg","foot"];

  var browseFilter = null;   // region id, or null for the whole skeleton
  var browseMode = "region";  // "region" | "class" | "rib"

  function browseGrouping(){
    if (browseMode === "class" && window.BONECLASS){ return window.BONECLASS; }
    if (browseMode === "rib" && window.RIBCLASS){ return window.RIBCLASS; }
    return null;
  }

  // Cartilage is shown in the atlas and can be tapped, but it is not bone. It is
  // excluded from the bone list and from every count, so "x of y bones" means
  // bones.
  function isBone(b){ return b && b.cls !== "cartilage"; }

  function renderBrowse(){
    var wrap = document.getElementById("bone-browse");
    if (!wrap){ return; }
    wrap.innerHTML = "";
    var modes = document.createElement("div");
    modes.className = "browse-modes";
    var MODES = [["region","browse.by.region"],["class","browse.by.class"],["rib","browse.by.rib"]];
    for (var mi = 0; mi < MODES.length; mi++){
      (function(mk, lbl){
        var mb = document.createElement("button");
        mb.type = "button";
        mb.className = "browse-mode" + (browseMode === mk ? " on" : "");
        mb.textContent = t(lbl);
        mb.addEventListener("click", function(){
          browseMode = mk; browseFilter = null; renderBrowse();
        });
        modes.appendChild(mb);
      })(MODES[mi][0], MODES[mi][1]);
    }
    wrap.appendChild(modes);

    if (browseFilter){
      var clr = document.createElement("button");
      clr.type = "button";
      clr.className = "res-item";
      clr.textContent = t("browse.showall");
      clr.addEventListener("click", function(){ browseFilter = null; renderBrowse(); });
      wrap.appendChild(clr);
    }
    var groups = {}, i, b, r;
    var G = browseGrouping();
    if (G){
      for (i = 0; i < G.order.length; i++){
        var key = G.order[i];
        groups[key] = [];
        for (var m = 0; m < G.map[key].length; m++){
          if (byId[G.map[key][m]]){ groups[key].push(byId[G.map[key][m]]); }
        }
      }
    } else {
      for (i = 0; i < BONES.length; i++){
        b = BONES[i];
        if (!isBone(b)){ continue; }
        r = b.region || "";
        if (!groups[r]){ groups[r] = []; }
        groups[r].push(b);
      }
    }
    // Any region not in the fixed order still gets rendered, appended at the end,
    // so a new region in bones.js can never silently vanish from the list.
    var order = G ? G.order.slice() : REGION_ORDER.slice(), key;
    if (G){ order = G.order.slice(); }
    for (key in groups){
      if (Object.prototype.hasOwnProperty.call(groups, key) && order.indexOf(key) === -1){
        order.push(key);
      }
    }
    for (var o = 0; o < order.length; o++){
      var list = groups[order[o]];
      if (!list || !list.length){ continue; }
      if (browseFilter && order[o] !== browseFilter){ continue; }
      if (G && browseFilter){ continue; }
      list.sort(function(x, y){
        var kx = svKey(x.sv), ky = svKey(y.sv);
        return kx < ky ? -1 : (kx > ky ? 1 : 0);
      });
      var h = document.createElement("div");
      h.className = "browse-h";
      var hn = document.createElement("span");
      hn.textContent = G ? (G[settings.ui === "en" ? "en" : "sv"][order[o]] || order[o]) : regionName(order[o]);
      var hc = document.createElement("span");
      hc.className = "browse-n";
      hc.textContent = list.length;
      h.appendChild(hn);
      h.appendChild(hc);
      wrap.appendChild(h);
      for (i = 0; i < list.length; i++){ wrap.appendChild(resultItem(list[i])); }
    }
  }

  // ---------- QUIZ (pure state; never navigates on its own) ----------
  var QUIZ_LEN = 10;
  var quiz = null;   // { pool, order, i, score, missed[], answered }

  // aggregates only (Stefan/trap 6): per-bone seen/correct, never an event log
  var quizStats = {};   // { id: {s:seen, c:correct} }

  function loadQuizStats(){
    try {
      var raw = window.localStorage.getItem("ba_quizstats");
      if (raw){ quizStats = JSON.parse(raw) || {}; }
    } catch (e) { quizStats = {}; }
  }
  function saveQuizStats(){
    try { window.localStorage.setItem("ba_quizstats", JSON.stringify(quizStats)); }
    catch (e) { /* in-memory only */ }
  }
  function recordAnswer(id, correct){
    var r = quizStats[id] || { s:0, c:0 };
    r.s += 1;
    if (correct){ r.c += 1; }
    quizStats[id] = r;
    saveQuizStats();
  }

  function shuffle(a){
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // only drawn bones can be "which bone is highlighted?"
  // Bones whose marker position in the atlas is NOT trustworthy. The hit areas
  // are horizontal bands, and in the hand and foot the bones are small, angled
  // and tightly packed, so a band can sit on the neighbouring bone entirely
  // (metacarpal I's box lands on the thumb's distal phalanx). A quiz that marks
  // the right answer wrong is worse than no quiz question, so these are excluded
  // until the outlines are rebuilt from the vector regions.
  // The hand's metacarpals and phalanges have been rebuilt from the vector
  // outlines: the rays are structurally determined (five rays, and the one with
  // three bones IS the thumb), so those are trustworthy now. The CARPALS are not
  // — the pisiform lies palmar to the triquetrum and cannot be told apart in a
  // front view, so naming them would be guesswork. The foot is still untouched.
  // Identity now comes from the source data (BodyParts3D carries the anatomical
  // name per mesh), so nothing is "unverified placement" any more. Cartilage is
  // shown and tappable but is not bone, so it stays out of the quiz.
  function placementUnverified(b){ return !!(b && b.cls === "cartilage"); }

  function quizPool(){
    // only ask about bones you can actually see in the current view, and whose
    // marker is known to sit on the right bone
    var pool = [];
    for (var i = 0; i < BONES.length; i++){
      if (BONES[i].shown && vPolys(BONES[i]).length && !placementUnverified(BONES[i])){
        pool.push(BONES[i]);
      }
    }
    return pool;
  }

  // 3 distractors: prefer region-mates, fall back to any bone (thin regions)
  function distractorsFor(bone, pool){
    var mates = [], others = [];
    for (var i = 0; i < pool.length; i++){
      var b = pool[i];
      if (b.id === bone.id){ continue; }
      if (b.region === bone.region){ mates.push(b); } else { others.push(b); }
    }
    shuffle(mates); shuffle(others);
    var picks = mates.concat(others).slice(0, 3);
    return picks;
  }

  function startQuiz(){
    var pool = quizPool();
    var order = shuffle(pool.slice());
    var n = Math.min(QUIZ_LEN, order.length);
    quiz = { pool:pool, order:order.slice(0, n), i:0, score:0, missed:[], answered:false };
    // hide the selection strip: it sits above the quiz overlay and would otherwise
    // float a stale bone name over the quiz ("visa bug")
    var strip = document.getElementById("sel-strip");
    if (strip){ strip.className = ""; }
    document.getElementById("quiz-overlay").className = "show";
    // reset the panel to question mode (results view may have replaced it)
    restoreQuizPanel();
    // the overlay just changed the map's visible area; recompute BEFORE flyTo,
    // otherwise fitBounds targets a stale viewport and the bone renders off-screen
    if (map){ map.invalidateSize(); }
    renderQuestion();
  }

  function endQuiz(){
    stopCram();
    quiz = null;
    var ov = document.getElementById("quiz-overlay");
    ov.className = "";
    // clear any quiz highlight from the map
    if (selectedId){ var keep = selectedId; selectedId = null; applyStyle(keep); }
    selectedId = null;
    // make sure the selection strip is not left stuck showing a stale bone
    var strip = document.getElementById("sel-strip");
    if (strip){ strip.className = ""; }
  }

  function renderQuestion(){
    if (!quiz){ return; }
    var q = quiz.order[quiz.i];
    quiz.answered = false;

    if (quiz.cram){
      paintCramClock(quiz.endAt - (new Date()).getTime());
    } else {
      document.getElementById("quiz-progress").textContent =
        t("quiz.of", { n:quiz.i + 1, m:quiz.order.length });
    }
    document.getElementById("quiz-qtext").textContent = t("quiz.q");

    // highlight the target bone on the map underneath (reuses selection styling).
    // Pick ONE side so a paired bone lights a single leg/arm, not both.
    var prev = selectedId;
    selectedId = q.id;
    var qSides = bandSides(q), hasRight = false;
    for (var qs = 0; qs < qSides.length; qs++){ if (qSides[qs] === 1){ hasRight = true; break; } }
    selectedSide = hasRight ? Math.floor(Math.random() * 2) : 0;
    if (prev && prev !== q.id){ applyStyle(prev); }
    applyStyle(q.id);
    // frame after a tick: on a fresh overlay the map size may not be settled yet,
    // and framing against a stale size zooms the bone off-screen (the blank-map bug)
    (function(bid){
      if (window.requestAnimationFrame){
        window.requestAnimationFrame(function(){
          if (map){ map.invalidateSize(); }
          frameQuizBone(bid);
        });
      } else {
        window.setTimeout(function(){
          if (map){ map.invalidateSize(); }
          frameQuizBone(bid);
        }, 30);
      }
    })(q.id);

    // build 4 options: target + 3 distractors, in the primary-name language
    var opts = distractorsFor(q, quiz.pool).concat([q]);
    shuffle(opts);

    var wrap = document.getElementById("quiz-options");
    wrap.innerHTML = "";
    for (var k = 0; k < opts.length; k++){
      (function(opt){
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "quiz-opt";
        var nm = names(opt);
        btn.textContent = nm.first;
        btn.style.fontStyle = nm.firstIsLatin ? "italic" : "normal";
        btn.addEventListener("click", function(){ answerQuestion(opt, btn); });
        wrap.appendChild(btn);
      })(opts[k]);
    }

    var fb = document.getElementById("quiz-feedback");
    fb.className = "quiz-feedback"; fb.textContent = "";
    document.getElementById("quiz-next").style.display = "none";
  }

  function answerQuestion(picked, btn){
    if (!quiz || quiz.answered){ return; }   // one answer per question (idempotent)
    quiz.answered = true;
    var q = quiz.order[quiz.i];
    var correct = (picked.id === q.id);

    recordAnswer(q.id, correct);
    if (correct){ quiz.score += 1; }
    else { quiz.missed.push(q.id); }

    // mark the buttons
    var btns = document.getElementById("quiz-options").querySelectorAll(".quiz-opt");
    for (var i = 0; i < btns.length; i++){
      btns[i].disabled = true;
    }
    btn.className = "quiz-opt " + (correct ? "correct" : "wrong");
    if (!correct){
      // also reveal the correct one
      for (var j = 0; j < btns.length; j++){
        if (btns[j].textContent === names(q).first){ btns[j].className = "quiz-opt correct"; }
      }
    }

    var fb = document.getElementById("quiz-feedback");
    if (correct){
      fb.className = "quiz-feedback ok"; fb.textContent = t("quiz.correct");
    } else {
      fb.className = "quiz-feedback no";
      fb.textContent = t("quiz.wrong", { a:names(q).first });
    }

    var next = document.getElementById("quiz-next");
    var last = (quiz.i >= quiz.order.length - 1);
    next.textContent = last ? t("quiz.finish") : t("quiz.next");
    next.style.display = "block";
  }

  function nextQuestion(){
    if (!quiz){ return; }
    if (quiz.i >= quiz.order.length - 1){ showResults(); return; }
    quiz.i += 1;
    renderQuestion();
  }

  function restoreQuizPanel(){
    // rebuild the standard question panel (results view replaces its innerHTML)
    var stage = document.getElementById("quiz-stage");
    stage.innerHTML =
      '<div class="quiz-maparea"></div>' +
      '<div class="quiz-panel" id="quiz-panel">' +
      '<p class="quiz-qtext" id="quiz-qtext"></p>' +
      '<div id="quiz-options"></div>' +
      '<div class="quiz-feedback" id="quiz-feedback"></div>' +
      '<button class="quiz-next" id="quiz-next" type="button" style="display:none;"></button>' +
      '</div>';
    document.getElementById("quiz-next").addEventListener("click", nextQuestion);
  }

  function showResults(){
    if (!quiz){ return; }
    // clear the map highlight so the results card isn't competing with a lit bone
    if (selectedId){ var keep = selectedId; selectedId = null; applyStyle(keep); }

    var stage = document.getElementById("quiz-stage");
    stage.innerHTML = "";

    var card = document.createElement("div");
    card.className = "quiz-result";

    var big = document.createElement("div");
    big.className = "quiz-bigscore";
    big.textContent = quiz.score + "/" + quiz.order.length;
    card.appendChild(big);

    var sub = document.createElement("p");
    sub.className = "quiz-scoresub";
    sub.textContent = t("quiz.score", { n:quiz.score, m:quiz.order.length });
    card.appendChild(sub);

    if (quiz.missed.length){
      var h = document.createElement("p");
      h.className = "quiz-missed-h";
      h.textContent = t("quiz.missed");
      card.appendChild(h);
      // dedupe missed ids (a bone can only appear once per round anyway)
      var seen = {};
      for (var i = 0; i < quiz.missed.length; i++){
        var id = quiz.missed[i];
        if (seen[id]){ continue; }
        seen[id] = 1;
        (function(bid){
          var chip = document.createElement("button");
          chip.type = "button";
          chip.className = "quiz-chip";
          chip.textContent = names(byId[bid]).first;
          // tappable -> opens that bone (explicit user action, so navigation is allowed)
          chip.addEventListener("click", function(){
            endQuiz();
            openBone(bid);
            goToPage("page-bone");
          });
          card.appendChild(chip);
        })(id);
      }
      var tip = document.createElement("p");
      tip.className = "quiz-scoresub";
      tip.style.marginTop = "12px";
      tip.textContent = t("quiz.taptostudy");
      card.appendChild(tip);

      // If the misses cluster in one region, offer the guide chapter for it.
      // Two or more misses in the same region means the gap is the topic, not
      // the individual bone.
      var byReg = {}, worst = null, wn = 0, rk;
      for (rk in seen){
        if (!Object.prototype.hasOwnProperty.call(seen, rk) || !byId[rk]){ continue; }
        var rg = byId[rk].region;
        if (!rg){ continue; }
        byReg[rg] = (byReg[rg] || 0) + 1;
        if (byReg[rg] > wn){ wn = byReg[rg]; worst = rg; }
      }
      if (worst && wn >= 2 && window.GUIDE){
        var topic = null;
        for (var gi = 0; gi < window.GUIDE.length; gi++){
          var gg = window.GUIDE[gi];
          if (gg.regions && gg.regions.indexOf(worst) !== -1){ topic = gg; }
        }
        if (topic){
          (function(tp, rg){
            var rb = document.createElement("button");
            rb.type = "button";
            rb.className = "quiz-again";
            rb.style.marginTop = "14px";
            rb.textContent = t("quiz.readguide", { x: regionName(rg) });
            rb.addEventListener("click", function(){ endQuiz(); openGuide(tp.id); });
            card.appendChild(rb);
          })(topic, worst);
        }
      }
    } else {
      var allok = document.createElement("p");
      allok.className = "quiz-scoresub";
      allok.textContent = t("quiz.allright");
      card.appendChild(allok);
    }

    var actions = document.createElement("div");
    actions.className = "quiz-result-actions";
    var again = document.createElement("button");
    again.type = "button"; again.className = "quiz-again";
    again.textContent = t("quiz.again");
    again.addEventListener("click", startQuiz);
    actions.appendChild(again);
    var close = document.createElement("button");
    close.type = "button"; close.className = "quiz-closebtn";
    close.textContent = t("quiz.close");
    close.addEventListener("click", endQuiz);
    actions.appendChild(close);
    card.appendChild(actions);

    stage.appendChild(card);
  }

  // weakest region for the MINA strip: lowest correct-rate among answered regions
  function quizSummary(){
    var totalS = 0, totalC = 0, byreg = {};
    for (var id in quizStats){
      if (!Object.prototype.hasOwnProperty.call(quizStats, id)){ continue; }
      if (!byId[id]){ continue; }
      var r = quizStats[id];
      totalS += r.s; totalC += r.c;
      var reg = byId[id].region;
      var g = byreg[reg] || { s:0, c:0 };
      g.s += r.s; g.c += r.c; byreg[reg] = g;
    }
    if (!totalS){ return null; }
    var weak = null, weakRate = 2;
    for (var rg in byreg){
      if (!Object.prototype.hasOwnProperty.call(byreg, rg)){ continue; }
      if (byreg[rg].s < 2){ continue; }   // need a couple of answers to judge
      var rate = byreg[rg].c / byreg[rg].s;
      if (rate < weakRate){ weakRate = rate; weak = rg; }
    }
    return { seen:totalS, correct:totalC,
             pct:Math.round(100 * totalC / totalS), weakRegion:weak };
  }

  // ---------- WIRE ----------
  var wired = false;
  function onReady(){
    if (wired){ return; }   // WebView reloads / config changes can fire this twice
    wired = true;
    loadStudied();
    loadSettings();
    loadQuizStats();
    initMap();
    applyTheme();
    applyI18n();

    var btns = document.querySelectorAll(".nav-btn");
    for (var i = 0; i < btns.length; i++){
      btns[i].addEventListener("click", function(ev){
        var b = ev.currentTarget;
        var action = b.getAttribute("data-action");
        var page = b.getAttribute("data-page");
        if (action === "quiz"){
          goToPage("page-atlas");   // quiz overlay lives on the atlas
          startQuiz();
          return;
        }
        if (action === "search"){
          goToPage("page-atlas");
          try { document.getElementById("search-input").focus(); } catch (e) {}
          return;
        }
        if (page === "page-bone"){
          if (selectedId){ openBone(selectedId); }
          goToPage("page-bone");
          return;
        }
        if (page){ goToPage(page); }
      });
    }

    var goers = document.querySelectorAll("[data-go]");
    for (var g = 0; g < goers.length; g++){
      goers[g].addEventListener("click", function(ev){
        goToPage(ev.currentTarget.getAttribute("data-go"));
      });
    }

    var backs = document.querySelectorAll("[data-back]");
    for (var bk = 0; bk < backs.length; bk++){
      backs[bk].addEventListener("click", function(ev){
        goToPage(ev.currentTarget.getAttribute("data-back"));
      });
    }

    // two-tap confirm: no native dialog, and no accidental wipe
    document.getElementById("opt-reset").addEventListener("click", function(){
      var lbl = document.getElementById("reset-label");
      if (!resetArmed){
        resetArmed = true;
        lbl.textContent = t("set.reset.confirm");
        return;
      }
      studied = {};
      saveStudied();
      resetArmed = false;
      lbl.textContent = t("set.reset");
      renderMina();
      showToast(t("toast.reset"));
    });

    // The whole strip is tappable, not just the OPEN button. On old WebViews a
    // small button hit-rect can be unreliable near a Leaflet pane; tapping the
    // bone name is an obvious fallback and never hurts.
    function openSelected(){
      if (selectedId){ openBone(selectedId); goToPage("page-bone"); }
    }
    document.getElementById("sel-open").addEventListener("click", function(ev){
      if (ev && ev.stopPropagation){ ev.stopPropagation(); }
      openSelected();
    });
    document.getElementById("sel-strip").addEventListener("click", openSelected);

    document.getElementById("search-input").addEventListener("input", function(ev){
      runSearch(ev.target.value);
    });

    var vtb = document.getElementById("view-toggle");
    if (vtb){
      vtb.querySelector(".vt-label").textContent = t("view.front");
      vtb.addEventListener("click", toggleView);
    }

    var ftb = document.getElementById("foot-toggle");
    if (ftb){ ftb.addEventListener("click", toggleFoot); }
    paintFootToggle();

    document.getElementById("quiz-x").addEventListener("click", endQuiz);
    var qn = document.getElementById("quiz-next");
    if (qn){ qn.addEventListener("click", nextQuestion); }

    var bb = document.getElementById("bone-back");
    if (bb){ bb.addEventListener("click", showBrowse); }

    var cs = document.getElementById("cram-start");
    if (cs){ cs.addEventListener("click", startCram); }
    var pm = document.getElementById("prog-more");
    if (pm){ pm.addEventListener("click", function(){ goToPage("page-mer"); }); }

    renderMina();
    renderBrowse();
  }

  // ---------- v5.1.0: adaptive cram + weakness heatmap ----------
  var CRAM_MS = 10 * 60 * 1000;
  var cramTimer = null;

  // weakest first: never-seen bones lead, then lowest accuracy, then least seen.
  function adaptiveOrder(pool){
    var scored = [];
    for (var i = 0; i < pool.length; i++){
      var b = pool[i], r = quizStats[b.id];
      var seen = r ? r.s : 0;
      var acc = seen ? (r.c / seen) : -1;          // -1 sorts unseen to the front
      scored.push({ b:b, acc:acc, seen:seen, j:Math.random() });
    }
    scored.sort(function(x, y){
      if (x.acc !== y.acc){ return x.acc - y.acc; }
      if (x.seen !== y.seen){ return x.seen - y.seen; }
      return x.j - y.j;
    });
    var out = [];
    for (var k = 0; k < scored.length; k++){ out.push(scored[k].b); }
    return out;
  }

  function startCram(){
    var pool = quizPool();
    if (!pool.length){ showToast(t("prog.heat.none")); return; }
    var order = adaptiveOrder(pool);
    quiz = { pool:pool, order:order, i:0, score:0, missed:[], answered:false,
             cram:true, endAt:(new Date()).getTime() + CRAM_MS };
    goToPage("page-atlas");
    var strip = document.getElementById("sel-strip");
    if (strip){ strip.className = ""; }
    document.getElementById("quiz-overlay").className = "show";
    restoreQuizPanel();
    if (map){ map.invalidateSize(); }
    renderQuestion();
    if (cramTimer){ window.clearInterval(cramTimer); }
    cramTimer = window.setInterval(cramTick, 1000);
  }

  function cramTick(){
    if (!quiz || !quiz.cram){ stopCram(); return; }
    var left = quiz.endAt - (new Date()).getTime();
    if (left <= 0){ stopCram(); showToast(t("cram.done")); endQuiz(); return; }
    paintCramClock(left);
  }

  function paintCramClock(left){
    var el = document.getElementById("quiz-progress");
    if (!el){ return; }
    var sec = Math.max(0, Math.floor(left / 1000));
    var mm = Math.floor(sec / 60), ss = sec % 60;
    el.textContent = t("cram.left", { m:mm, s:(ss < 10 ? "0" + ss : "" + ss), n:quiz.score });
  }

  function stopCram(){
    if (cramTimer){ window.clearInterval(cramTimer); cramTimer = null; }
  }

  // region accuracy, aggregated from the same per-bone stats the quiz writes
  function regionAccuracy(){
    var acc = {};
    for (var i = 0; i < BONES.length; i++){
      var b = BONES[i], r = quizStats[b.id];
      if (!r || !r.s){ continue; }
      var a = acc[b.region] || { s:0, c:0 };
      a.s += r.s; a.c += r.c;
      acc[b.region] = a;
    }
    return acc;
  }

  function renderHeatmap(){
    var host = document.getElementById("heatmap");
    if (!host){ return; }
    host.innerHTML = "";
    var acc = regionAccuracy();
    var regions = [], seenAny = false, k;
    for (var i = 0; i < BONES.length; i++){
      if (regions.indexOf(BONES[i].region) === -1){ regions.push(BONES[i].region); }
    }
    for (k in acc){ if (Object.prototype.hasOwnProperty.call(acc, k)){ seenAny = true; } }
    if (!seenAny){
      var e = document.createElement("p");
      e.className = "heat-empty";
      e.textContent = t("prog.heat.none");
      host.appendChild(e);
      return;
    }
    regions.sort(function(a, b){
      var ra = acc[a], rb = acc[b];
      var pa = ra && ra.s ? ra.c / ra.s : 2;      // untested regions sort last
      var pb = rb && rb.s ? rb.c / rb.s : 2;
      return pa - pb;
    });
    for (var j = 0; j < regions.length; j++){
      var reg = regions[j], r = acc[reg];
      var cell = document.createElement("div");
      var pct = (r && r.s) ? Math.round(100 * r.c / r.s) : null;
      cell.className = "heat-cell " + (pct === null ? "lv-none"
        : pct < 50 ? "lv-bad" : pct < 75 ? "lv-mid" : "lv-good");
      var nm = document.createElement("span");
      nm.className = "hc-name";
      nm.textContent = regionName(reg);
      var vl = document.createElement("span");
      vl.className = "hc-val";
      vl.textContent = (pct === null) ? t("heat.unseen") : t("heat.cell", { p:pct });
      cell.appendChild(nm); cell.appendChild(vl);
      host.appendChild(cell);
    }
  }

  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", onReady);
  } else {
    onReady();
  }
})();
</script>
