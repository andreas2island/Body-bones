<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BoneAtlas</title>
<style>
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;
	outline-offset: 1px;
	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {
	border: 2px dotted #38f;
	background: rgba(255,255,255,0.5);
	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;
	background-repeat: no-repeat;
	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;
	border-top-right-radius: 4px;
	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;
	border-top-right-radius: 2px;
	}
.leaflet-touch .leaflet-bar a:last-child {
	border-bottom-left-radius: 2px;
	border-bottom-right-radius: 2px;
	}

/* zoom control */

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {
	font: bold 18px 'Lucida Console', Monaco, monospace;
	text-indent: 1px;
	}

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {
	font-size: 22px;
	}

/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {
	background: #fff;
	background: rgba(255, 255, 255, 0.8);
	margin: 0;
	}
.leaflet-control-attribution,
.leaflet-control-scale-line {
	padding: 0 5px;
	color: #333;
	line-height: 1.4;
	}
.leaflet-control-attribution a {
	text-decoration: none;
	}
.leaflet-control-attribution a:hover,
.leaflet-control-attribution a:focus {
	text-decoration: underline;
	}
.leaflet-attribution-flag {
	display: inline !important;
	vertical-align: baseline !important;
	width: 1em;
	height: 0.6669em;
	}
.leaflet-left .leaflet-control-scale {
	margin-left: 5px;
	}
.leaflet-bottom .leaflet-control-scale {
	margin-bottom: 5px;
	}
.leaflet-control-scale-line {
	border: 2px solid #777;
	border-top: none;
	line-height: 1.1;
	padding: 2px 5px 1px;
	white-space: nowrap;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	background: rgba(255, 255, 255, 0.8);
	text-shadow: 1px 1px #fff;
	}
.leaflet-control-scale-line:not(:first-child) {
	border-top: 2px solid #777;
	border-bottom: none;
	margin-top: -2px;
	}
.leaflet-control-scale-line:not(:first-child):not(:last-child) {
	border-bottom: 2px solid #777;
	}

.leaflet-touch .leaflet-control-attribution,
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	box-shadow: none;
	}
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	border: 2px solid rgba(0,0,0,0.2);
	background-clip: padding-box;
	}


/* popup */

.leaflet-popup {
	position: absolute;
	text-align: center;
	margin-bottom: 20px;
	}
.leaflet-popup-content-wrapper {
	padding: 1px;
	text-align: left;
	border-radius: 12px;
	}
.leaflet-popup-content {
	margin: 13px 24px 13px 20px;
	line-height: 1.3;
	font-size: 13px;
	font-size: 1.08333em;
	min-height: 1px;
	}
.leaflet-popup-content p {
	margin: 17px 0;
	margin: 1.3em 0;
	}
.leaflet-popup-tip-container {
	width: 40px;

  /* pin marker for small/clustered bones (carpals, phalanges, tiny facial bones):
     a clear dot on the bone instead of an inaccurate box */
  .bone-pin{ filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4)); }

  /* ============ v5.1.0 — warm anatomical textbook ============ */
  :root{ --gold:#8a5a06; --gold-bg:#f4e3bd; --ok:#2e7d4f; --err:#b3261e;
         --warn:#8f4706; --warn-bg:#fbe6d2; --nav-text:#cfe3da; --nav-active:#f0c453; }
  html.t-dark{ --gold:#e8b53a; --gold-bg:#3b3116; --ok:#5cc48a; --err:#ef7a72;
               --warn:#f0994a; --warn-bg:#3a2617; --nav-text:#bcd6cc; --nav-active:#f0c453; }
  @media (prefers-color-scheme: dark){
    :root{ --gold:#e8b53a; --gold-bg:#3b3116; --ok:#5cc48a; --err:#ef7a72;
           --warn:#f0994a; --warn-bg:#3a2617; --nav-text:#bcd6cc; --nav-active:#f0c453; }
  }
  html.t-light{ --gold:#8a5a06; --gold-bg:#f4e3bd; --ok:#2e7d4f; --err:#b3261e;
                --warn:#8f4706; --warn-bg:#fbe6d2; --nav-text:#cfe3da; --nav-active:#f0c453; }

  /* nav sits on deep medical green in BOTH themes, so its own text colours
     are fixed against that green rather than following --text */
  .nav-btn{ color:var(--nav-text); }
  .nav-btn svg{ stroke:var(--nav-icon); }
  .nav-btn.active{ color:var(--nav-active); font-weight:700; }
  .nav-btn.active svg{ stroke:var(--nav-active); }
  .nav-btn .nav-ind{ background:var(--nav-active); }

  /* name sheet: Latin, Svenska and English together */
  #sel-strip{ align-items:flex-start; padding:12px 12px 14px 12px;
              border-top:2px solid var(--nav-border); }
  #sel-en{ font-size:13px; color:var(--text-dim); white-space:nowrap;
           overflow:hidden; text-overflow:ellipsis; }
  #sel-meta{ margin-top:6px; }
  .sheet-chip{ display:inline-block; margin:0 6px 0 0; padding:2px 8px;
               border-radius:10px; font-size:11px; background:var(--chip-bg);
               color:var(--text-dim); }
  .sheet-chip.warn{ background:var(--warn-bg); color:var(--warn); font-weight:600; }
  #sel-open{ align-self:center; }

  /* progress page */
  #prog-tools{ flex:0 0 auto; padding:4px 12px 0 12px; }
  .prog-card{ width:100%; box-sizing:border-box; display:flex; align-items:center;
              justify-content:space-between; text-align:left; margin:0 0 8px 0;
              padding:12px 14px; background:var(--surface); color:var(--text);
              border:1px solid var(--input-border); border-radius:10px;
              font-family:inherit; font-size:15px; }
  .prog-card.disabled{ opacity:1; background:var(--bg); }
  .pc-text{ display:flex; flex-direction:column; min-width:0; padding-right:10px; }
  .pc-sub{ font-size:12px; color:var(--text-dim); margin-top:2px;
           white-space:normal; }
  .pc-sub.warn-text{ color:var(--warn); }
  .pc-go{ flex:0 0 auto; color:var(--accent); font-size:15px; }
  .pc-badge{ flex:0 0 auto; width:22px; height:22px; line-height:22px;
             text-align:center; border-radius:11px; font-size:13px; font-weight:700; }
  .pc-badge.warn{ background:var(--warn-bg); color:var(--warn); }
  .prog-h{ margin:12px 0 8px 0; font-size:13px; font-weight:700;
           letter-spacing:0.04em; text-transform:uppercase; color:var(--text-dim); }
  #heatmap{ display:flex; flex-wrap:wrap; margin:0 0 10px 0; }
  .heat-cell{ flex:0 0 auto; width:31%; box-sizing:border-box; margin:0 3.5% 8px 0;
              padding:8px 8px 9px 8px; border-radius:9px; border:1px solid var(--input-border); }
  .heat-cell:nth-child(3n){ margin-right:0; }
  .hc-name{ display:block; font-size:12px; overflow:hidden;
            white-space:nowrap; text-overflow:ellipsis; }
  .hc-val{ display:block; font-size:17px; font-weight:700; margin-top:2px; }
  .heat-cell.lv-bad{ background:var(--warn-bg); border-color:var(--warn); }
  .heat-cell.lv-bad .hc-name, .heat-cell.lv-bad .hc-val{ color:var(--err); }
  .heat-cell.lv-mid{ background:var(--gold-bg); border-color:var(--gold); }
  .heat-cell.lv-mid .hc-name, .heat-cell.lv-mid .hc-val{ color:var(--gold); }
  .heat-cell.lv-good{ background:var(--surface); border-color:var(--ok); }
  .heat-cell.lv-good .hc-name, .heat-cell.lv-good .hc-val{ color:var(--ok); }
  .heat-cell.lv-none{ background:var(--surface); }
  .heat-cell.lv-none .hc-name, .heat-cell.lv-none .hc-val{ color:var(--text-dim); }
  .heat-empty{ font-size:13px; color:var(--text-dim); margin:0 0 10px 0; }

  /* v5.1.1 — the Progress page must scroll as ONE column. As a flex column the
     tools block could not shrink and the list took the remaining space, so on a
     short screen the content below the fold was unreachable (settings bug). */
  #page-mina.active{ display:block; }
  #page-mina #mina-list{ flex:none; overflow:visible; }
  #page-mina .mina-head{ position:sticky; top:0; z-index:2; }

  /* v5.2.0 — foot detail view */
  #foot-toggle{ position:absolute; right:12px; bottom:64px; z-index:640;
                display:flex; align-items:center; padding:8px 14px;
                background:var(--surface); color:var(--text);
                border:1px solid var(--input-border); border-radius:22px;
                font-family:inherit; font-size:13px; font-weight:700;
                letter-spacing:0.03em; }
  #foot-toggle svg{ width:17px; height:17px; stroke:var(--text); fill:none;
                    stroke-width:2; margin-right:7px; }
  #foot-toggle.on{ background:var(--accent); color:var(--on-accent);
                   border-color:var(--accent); }
  #foot-toggle.on svg{ stroke:var(--on-accent); }
  #foot-note{ display:none; flex:0 0 auto; padding:7px 12px;
              background:var(--chip-bg); color:var(--text-dim); font-size:12px; }
  #foot-note.show{ display:block; }
</style>
</head>
<body>
<div id="app">
  <div id="pages">

    <div id="page-atlas" class="page active">
      <div class="atlas-head">
        <input id="search-input" type="text" data-i18n-ph="search.placeholder" placeholder="Sök ben – svenska, latin, engelska">
      </div>
      <div id="atlas-map-wrap">
        <div id="atlas-map"></div>
        <button id="foot-toggle" type="button">
          <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"><path d="M9 3c2.5 0 4 1.6 4 4 0 2.2-.8 3.4-.8 5.2 0 1.4.9 2.1.9 3.4 0 2-1.7 3.4-4.1 3.4S5 17.6 5 15.2C5 11 9 9.2 9 6.4"/><circle cx="16.5" cy="6.5" r="1.3"/><circle cx="18.4" cy="9.6" r="1.1"/></svg>
          <span class="vt-label" data-i18n="view.foot">FOT</span>
        </button>
        <button id="view-toggle" type="button">
          <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.6M20 12a8 8 0 0 1-13.7 5.6"/><path d="M17 3v4h-4M7 21v-4h4"/></svg>
          <span class="vt-label">FRAM</span>
        </button>
      </div>
      <div id="foot-note"><span data-i18n="foot.note">V\u00e4nster fot.</span></div>
      <div id="search-results"></div>
      <div id="sel-strip">
        <div id="sel-text">
          <div id="sel-sv"></div>
          <div id="sel-la"></div>
          <div id="sel-en"></div>
          <div id="sel-meta"></div>
        </div>
        <button id="sel-open" type="button" data-i18n="sel.open">VISA</button>
      </div>

      <div id="quiz-overlay">
        <div class="quiz-head">
          <span class="quiz-progress" id="quiz-progress"></span>
          <button class="quiz-x" id="quiz-x" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" stroke-width="2"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
          </button>
        </div>
        <div class="quiz-stage" id="quiz-stage">
          <div class="quiz-maparea"></div>
          <div class="quiz-panel" id="quiz-panel">
            <p class="quiz-qtext" id="quiz-qtext" data-i18n="quiz.q">Vilket ben är markerat?</p>
            <div id="quiz-options"></div>
            <div class="quiz-feedback" id="quiz-feedback"></div>
            <button class="quiz-next" id="quiz-next" type="button" style="display:none;"></button>
          </div>
        </div>
      </div>
    </div>

    <div id="page-bone" class="page">
      <div id="bone-content" style="display:none; flex-direction:column; flex:1 1 auto; min-height:0;">
        <div class="bone-head">
          <button type="button" id="bone-back" class="browse-back" data-i18n="browse.back">Alla ben</button>
          <h1 id="bone-sv"></h1>
          <p id="bone-la"></p>
          <p id="bone-en"></p>
          <div class="chips" id="bone-chips"></div>
        </div>
        <div class="bone-body" id="bone-body"></div>
      </div>
      <div id="bone-empty" class="browse-wrap">
        <div id="bone-browse"></div>
      </div>
    </div>

    <div id="page-mina" class="page">
      <div class="mina-head">
        <p id="mina-count">0</p>
        <p id="mina-sub"></p>
        <p id="mina-quiz" style="font-size:13px;color:var(--text-dim);margin:8px 0 0 0;"></p>
      </div>
      <div id="prog-tools">
        <button class="prog-card" id="prog-more" type="button">
          <span class="pc-text"><span data-i18n="prog.more">Mer</span><span class="pc-sub" data-i18n="prog.more.sub">Guide, leder, inst\u00e4llningar</span></span>
          <span class="pc-go">&#8250;</span>
        </button>
        <button class="prog-card" id="cram-start" type="button">
          <span class="pc-text"><span data-i18n="prog.cram">10-minuters plugg</span><span class="pc-sub" data-i18n="prog.cram.sub">Adaptivt</span></span>
          <span class="pc-go">&#9654;</span>
        </button>
        <div class="prog-card disabled">
          <span class="pc-text"><span data-i18n="prog.landmark">Landm\u00e4rkes-spotter</span><span class="pc-sub warn-text" data-i18n="prog.landmark.sub">Inte tillg\u00e4nglig \u00e4n.</span></span>
          <span class="pc-badge warn">!</span>
        </div>
        <h3 class="prog-h" data-i18n="prog.heat">Var du \u00e4r svagast</h3>
        <div id="heatmap"></div>
      </div>
      <div id="mina-list"></div>
    </div>

    <div id="page-mer" class="page">
      <div class="sub-head"><h2 class="sub-title" style="margin-left:12px;" data-i18n="mer.title">Mer</h2></div>
      <div class="menu-list">
        <button class="menu-item" data-go="page-guide" type="button">
          <span class="mi-text"><span data-i18n="mer.guide">Skelettguide</span><span class="mi-sub" data-i18n="mer.guide.sub">Faktadel \u2013 l\u00e4s om skelettet</span></span>
          <svg class="mi-chev" viewBox="0 0 24 24" stroke-width="2"><polyline points="9,5 16,12 9,19"/></svg>
        </button>
        <button class="menu-item" data-go="page-joints" type="button">
          <span class="mi-text"><span data-i18n="mer.joints">Leder</span><span class="mi-sub" data-i18n="mer.joints.sub">Axel, armb\u00e5ge, h\u00f6ft, kn\u00e4 och fler</span></span>
          <svg class="mi-chev" viewBox="0 0 24 24" stroke-width="2"><polyline points="9,5 16,12 9,19"/></svg>
        </button>
        <button class="menu-item" data-go="page-settings" type="button">
          <span class="mi-text"><span data-i18n="mer.settings">Inställningar</span><span class="mi-sub" id="mer-set-sub">Tema och språk</span></span>
          <svg class="mi-chev" viewBox="0 0 24 24" stroke-width="2"><polyline points="9,5 16,12 9,19"/></svg>
        </button>
        <button class="menu-item" data-go="page-about" type="button">
          <span class="mi-text"><span data-i18n="mer.about">Om BoneAtlas</span><span class="mi-sub" data-i18n="mer.about.sub">Version, källor och förbehåll</span></span>
          <svg class="mi-chev" viewBox="0 0 24 24" stroke-width="2"><polyline points="9,5 16,12 9,19"/></svg>
        </button>
      </div>
    </div>

    <div id="page-settings" class="page">
      <div class="sub-head">
        <button class="back-btn" data-back="page-mer" type="button">
          <svg viewBox="0 0 24 24" stroke-width="2"><polyline points="15,5 8,12 15,19"/></svg>
        </button>
        <h2 class="sub-title" data-i18n="set.title">Inställningar</h2>
      </div>
      <div class="menu-list">
        <div class="set-group" data-i18n="set.group.ui">Språk / Language</div>
        <div id="opt-ui"></div>
        <div class="set-group" data-i18n="set.group.theme">Tema</div>
        <div id="opt-theme"></div>
        <div class="set-group" data-i18n="set.group.names">Namn som visas först</div>
        <div id="opt-lang"></div>
        <div class="set-group" data-i18n="set.group.reset">Studerade ben</div>
        <button class="opt" id="opt-reset" type="button">
          <span class="o-text danger" id="reset-label" data-i18n="set.reset">Nollställ studerade ben</span>
        </button>
      </div>
    </div>

    <div id="page-guide" class="page">
      <div class="sub-head">
        <button class="back-btn" data-back="page-mer" type="button">
          <svg viewBox="0 0 24 24" stroke-width="2"><polyline points="15,5 8,12 15,19"/></svg>
        </button>
        <h2 class="sub-title" data-i18n="mer.guide">Skelettguide</h2>
      </div>
      <div class="browse-wrap"><div id="guide-list"></div></div>
    </div>

    <div id="page-joints" class="page">
      <div class="sub-head">
        <button class="back-btn" data-back="page-mer" type="button">
          <svg viewBox="0 0 24 24" stroke-width="2"><polyline points="15,5 8,12 15,19"/></svg>
        </button>
        <h2 class="sub-title" data-i18n="mer.joints">Leder</h2>
      </div>
      <div class="browse-wrap"><div id="joint-list"></div></div>
    </div>

    <div id="page-guide-article" class="page">
      <div class="sub-head">
        <button class="back-btn" data-back="page-guide" type="button">
          <svg viewBox="0 0 24 24" stroke-width="2"><polyline points="15,5 8,12 15,19"/></svg>
        </button>
        <h2 class="sub-title" id="guide-art-title"></h2>
      </div>
      <div class="about-body" id="guide-art-body"></div>
    </div>

    <div id="page-about" class="page">
      <div class="sub-head">
        <button class="back-btn" data-back="page-mer" type="button">
          <svg viewBox="0 0 24 24" stroke-width="2"><polyline points="15,5 8,12 15,19"/></svg>
        </button>
        <h2 class="sub-title" data-i18n="mer.about">Om BoneAtlas</h2>
      </div>
      <div class="about-body" id="about-body"></div>
    </div>

  </div>

  <nav id="bottom-nav">
    <button class="nav-btn active" data-page="page-atlas" type="button">
      <span class="nav-ind"></span>
      <svg viewBox="0 0 24 24" stroke-width="2"><path d="M9 4v16M15 4v16M4 8l5-2 6 2 5-2v14l-5 2-6-2-5 2z"/></svg>
      <span data-i18n="nav.atlas">ATLAS</span>
    </button>
    <button class="nav-btn" data-action="quiz" type="button">
      <span class="nav-ind"></span>
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><line x1="15.5" y1="15.5" x2="20" y2="20"/><line x1="11" y1="8.4" x2="11" y2="11.6"/><line x1="9.4" y1="10" x2="12.6" y2="10"/></svg>
      <span data-i18n="nav.spotter">SPOTTER</span>
    </button>
    <button class="nav-btn" data-page="page-bone" type="button">
      <span class="nav-ind"></span>
      <svg viewBox="0 0 24 24" stroke-width="2"><path d="M4 7a3 3 0 1 1 4 2.8h8A3 3 0 1 1 20 7a3 3 0 0 1-1.2 5.2v4A3 3 0 1 1 16 19H8a3 3 0 1 1-2.8-4v-3A3 3 0 0 1 4 7z"/></svg>
      <span data-i18n="nav.ben">BEN</span>
    </button>
    <button class="nav-btn" data-page="page-mina" type="button">
      <span class="nav-ind"></span>
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"><line x1="5" y1="20" x2="5" y2="13"/><line x1="12" y1="20" x2="12" y2="8"/><line x1="19" y1="20" x2="19" y2="4"/></svg>
      <span data-i18n="nav.progress">FRAMSTEG</span>
    </button>
  </nav>

  <div id="toast"></div>
</div>

<script>

<script>
window.GUIDE = [
  { id:"funktion", regions:[],
    sv:{ t:"Vad skelettet gör",
      s:"Sex uppgifter",
      p:["Ett vuxet skelett har 206 ben och fyller sex uppgifter samtidigt.",
         "Det skyddar inre organ: kraniet omsluter hjärnan, revbenen och bröstbenet skyddar hjärta och lungor, kotpelaren omger ryggmärgen.",
         "Det bär upp kroppen och ger den dess form, och det ger fästpunkter för muskler, senor och ligament.",
         "Benen fungerar som hävstänger. Musklerna drar, leden är vridpunkten, och rörelsen blir av.",
         "I benmärgen bildas blodkroppar. Processen kallas hematopoes.",
         "Skelettet är kroppens mineraldepå. Omkring 99 procent av kroppens kalcium finns lagrat i benvävnaden och kan frisättas vid behov."] },
    en:{ t:"What the skeleton does",
      s:"Six jobs at once",
      p:["An adult skeleton has 206 bones and does six jobs at the same time.",
         "It shields internal organs: the skull encloses the brain, the ribs and sternum guard the heart and lungs, the vertebral column surrounds the spinal cord.",
         "It supports the body and gives it shape, and it provides attachment points for muscles, tendons and ligaments.",
         "Bones work as levers. Muscles pull, the joint acts as the pivot, and movement follows.",
         "Blood cells are produced in bone marrow, a process called haematopoiesis.",
         "The skeleton is the body's mineral store. Roughly 99 percent of the body's calcium sits in bone tissue and can be released when needed."] } },

  { id:"axial", fig:"g_axial", regions:[],
    sv:{ t:"Axialt och appendikulärt",
      s:"80 + 126 = 206",
      p:["Skelettet delas i två delar.",
         "Det axiala skelettet bildar kroppens mittaxel: kraniet, kotpelaren och bröstkorgen. Det omfattar 80 ben, varav 6 är hörselben i mellanörat.",
         "Det appendikulära skelettet är kroppens bihang, alltså armar och ben tillsammans med skuldergördel och bäckengördel. Det omfattar 126 ben.",
         "Indelningen är praktisk att kunna. Den förklarar varför nyckelbenet räknas till extremiteterna trots att det ligger på bröstkorgen: det hör till skuldergördeln."] },
    en:{ t:"Axial and appendicular",
      s:"80 + 126 = 206",
      p:["The skeleton divides into two parts.",
         "The axial skeleton forms the body's central axis: the skull, the vertebral column and the thoracic cage. It contains 80 bones, 6 of which are the ossicles of the middle ear.",
         "The appendicular skeleton is the body's appendages, the arms and legs together with the shoulder and pelvic girdles. It contains 126 bones.",
         "The split is worth knowing. It explains why the clavicle counts as an extremity bone even though it lies across the chest: it belongs to the shoulder girdle."] } },

  { id:"kranium", fig:"g_kranium", regions:["skull"],
    sv:{ t:"Skallen",
      s:"28 ben, en rörlig led",
      p:["Skallen består av 28 ben: 8 i hjärnskålen, 14 i ansiktet och 6 hörselben.",
         "Hjärnskålen byggs av pannben, två hjässben, två tinningben, nackben, kilben och silben.",
         "Ansiktet innehåller bland annat överkäksben, okben, näsben, tårben, plogben, gomben och underkäken.",
         "Underkäken är skallens enda ben med en fritt rörlig led. Övriga skallben hålls ihop av suturer, som är orörliga fogar.",
         "Hos spädbarn är suturerna ännu inte slutna. De mjuka partierna kallas fontaneller; den bakre sluter sig omkring två månaders ålder, den främre mellan tio och arton månader.",
         "I nackbenets bas finns foramen magnum, den stora öppning där ryggmärgen passerar."] },
    en:{ t:"The skull",
      s:"28 bones, one movable joint",
      p:["The skull comprises 28 bones: 8 in the cranium, 14 in the face and 6 ossicles.",
         "The cranium is built from the frontal bone, two parietal bones, two temporal bones, the occipital bone, the sphenoid and the ethmoid.",
         "The face includes the maxillae, zygomatic bones, nasal bones, lacrimal bones, vomer, palatine bones and the mandible.",
         "The mandible is the only skull bone with a freely movable joint. The rest are held together by sutures, which are immobile.",
         "In infants the sutures have not yet closed. The soft areas are the fontanelles; the posterior closes at around two months, the anterior between ten and eighteen months.",
         "At the base of the occipital bone lies the foramen magnum, the large opening through which the spinal cord passes."] } },

  { id:"kotpelare", fig:"g_kotpelare", regions:["spine", "neck"],
    sv:{ t:"Kotpelaren",
      s:"33 kotor i fem avsnitt",
      p:["Kotpelaren räknar 33 kotor fördelade på fem avsnitt.",
         "7 halskotor bär upp huvudet och tillåter rotation. 12 bröstkotor ledar mot revbenen. 5 ländkotor bär den nedre ryggens belastning.",
         "Korsbenet är ett enda ben som bildats när fem kotor vuxit samman. Svanskotan består av fyra eller fem sammanvuxna kotor.",
         "Mellan kotorna ligger diskar av brosk som dämpar stötar.",
         "Ryggraden är inte rak. Krökarna ger den styrka och gör det möjligt att balansera upprätt."] },
    en:{ t:"The vertebral column",
      s:"33 vertebrae in five sections",
      p:["The vertebral column counts 33 vertebrae across five sections.",
         "7 cervical vertebrae support the head and allow rotation. 12 thoracic vertebrae articulate with the ribs. 5 lumbar vertebrae carry the load of the lower back.",
         "The sacrum is a single bone formed from five fused vertebrae. The coccyx consists of four or five fused vertebrae.",
         "Cartilage discs between the vertebrae absorb shock.",
         "The spine is not straight. Its curves give it strength and make upright balance possible."] } },

  { id:"brostkorg", fig:"g_brostkorg", regions:["thorax"],
    sv:{ t:"Bröstkorgen",
      s:"Äkta och falska revben",
      p:["Bröstbenet ligger mitt på bröstkorgen. Det är platt, ledar mot nyckelbenen och mot de översta revbensparen.",
         "Tillsammans med revbenen och bröstkotorna bildar det en flexibel bur runt hjärta och lungor. Bröstkorgen måste kunna vidga sig vid varje andetag.",
         "De sju översta revbensparen fäster direkt mot bröstbenet via revbensbrosk och kallas äkta revben.",
         "De fem nedre paren kallas falska revben eftersom de saknar direkt fäste mot bröstbenet. De understa paren fäster inte framtill alls och kallas ofta fria revben.",
         "Samtliga revben fäster bakåt mot kotpelaren."] },
    en:{ t:"The thoracic cage",
      s:"True and false ribs",
      p:["The sternum sits at the centre of the chest. It is flat, and articulates with the clavicles and the uppermost pairs of ribs.",
         "Together with the ribs and thoracic vertebrae it forms a flexible cage around the heart and lungs. The cage has to expand with every breath.",
         "The upper seven pairs attach directly to the sternum by costal cartilage and are called true ribs.",
         "The lower five pairs are called false ribs because they lack a direct attachment to the sternum. The lowest pairs have no anterior attachment at all and are often called floating ribs.",
         "Every rib attaches posteriorly to the vertebral column."] } },

  { id:"ovre", fig:"g_ovre", regions:["shoulder", "arm", "hand"],
    sv:{ t:"Övre extremiteten",
      s:"Från nyckelben till fingerspets",
      p:["Nyckelbenet och skulderbladet bildar skuldergördeln. Nyckelbenet ledar framtill mot bröstbenet, skulderbladet ligger som en triangel mot bröstkorgens baksida.",
         "Överarmsbenet är ett långt rörben. Nedåt möter det underarmens två ben i armbågsleden.",
         "Armbågsbenet ligger på lillfingersidan, strålbenet på tumsidan. Att hålla isär dem är ett vanligt tentafel.",
         "Handloven består av 8 små oregelbundna karpalben i två rader, sammanhållna av ligament.",
         "Fem mellanhandsben bildar handflatan. Fingrarna har tre falanger vardera, medan tummen bara har två.",
         "Tummens mellanhandsben har en ovanligt rörlig led mot trapetsbenet, vilket ger tummen dess stora rörelseomfång."] },
    en:{ t:"The upper limb",
      s:"From clavicle to fingertip",
      p:["The clavicle and scapula form the shoulder girdle. The clavicle articulates anteriorly with the sternum; the scapula sits as a triangle against the back of the thorax.",
         "The humerus is a long bone. Distally it meets the two forearm bones at the elbow joint.",
         "The ulna lies on the little-finger side, the radius on the thumb side. Confusing the two is a common exam error.",
         "The wrist consists of 8 small irregular carpal bones in two rows, bound by ligaments.",
         "Five metacarpals form the palm. Each finger has three phalanges; the thumb has only two.",
         "The thumb's metacarpal has an unusually mobile joint with the trapezium, which gives the thumb its wide range of movement."] } },

  { id:"nedre", fig:"g_nedre", regions:["pelvis", "leg", "foot"],
    sv:{ t:"Nedre extremiteten",
      s:"Från bäcken till tå",
      p:["Bäckengördeln bildas av tre benpar som växer samman under barndomen: tarmbenet överst och störst, sittbenet nedtill, och blygdbenen som möts framtill i blygdbenssymfysen.",
         "Lårbenet är kroppens längsta och tyngsta ben. Upptill ledar det mot höftskålen, nedtill mot skenbenet.",
         "Knäskålen är ett litet platt ben som skyddar knäleden.",
         "Skenbenet är det kraftigare av underbenets två ben och bär belastningen. Vadbenet ligger utanför och bär mycket lite vikt.",
         "Fotroten har 7 tarsalben. Språngbenet ingår i fotleden, hälbenet är störst, båtbenet ligger framför språngbenet, och de tre kilbenen samt tärningsbenet bildar fotvalvet.",
         "Fem mellanfotsben och 14 falanger bygger upp resten av foten. Stortån har två falanger, övriga tår tre."] },
    en:{ t:"The lower limb",
      s:"From pelvis to toe",
      p:["The pelvic girdle forms from three pairs of bones that fuse during childhood: the ilium uppermost and largest, the ischium below, and the pubic bones meeting anteriorly at the pubic symphysis.",
         "The femur is the longest and heaviest bone in the body. Proximally it articulates with the acetabulum, distally with the tibia.",
         "The patella is a small flat bone protecting the knee joint.",
         "The tibia is the stronger of the two lower leg bones and carries the load. The fibula lies laterally and bears very little weight.",
         "The tarsus has 7 bones. The talus forms part of the ankle joint, the calcaneus is the largest, the navicular lies in front of the talus, and the three cuneiforms with the cuboid form the arch of the foot.",
         "Five metatarsals and 14 phalanges make up the rest of the foot. The great toe has two phalanges, the others three."] } },

  { id:"bentyper", regions:[],
    sv:{ t:"Bentyper",
      s:"Formen följer funktionen",
      p:["Ben klassificeras efter sin form.",
         "Rörben är extremiteternas långa ben, till exempel lårben och överarmsben.",
         "Korta ben finns i handlov och fotrot. De är ungefär lika breda som långa och ger stabilitet med viss rörlighet.",
         "Platta ben skyddar och ger stora muskelfästen. Hit hör bröstbenet, skulderbladen och kraniets ben.",
         "Oregelbundna ben passar ingen av de övriga formerna. Kotorna och höftbenen är exempel.",
         "Sesamben är inbäddade i senor. Knäskålen är kroppens största."] },
    en:{ t:"Bone types",
      s:"Shape follows function",
      p:["Bones are classified by shape.",
         "Long bones are the long bones of the limbs, such as the femur and humerus.",
         "Short bones occur in the wrist and ankle. Roughly as wide as they are long, they give stability with some mobility.",
         "Flat bones protect and provide broad muscle attachment. The sternum, scapulae and cranial bones belong here.",
         "Irregular bones fit none of the other shapes. The vertebrae and hip bones are examples.",
         "Sesamoid bones are embedded in tendons. The patella is the largest in the body."] } },

  { id:"benvavnad", regions:[],
    sv:{ t:"Benvävnad",
      s:"Levande vävnad som byggs om",
      p:["Alla ben består av två slags benvävnad. Ytterst finns kompakt ben, tätt och slätt. Innanför ligger spongiöst ben, poröst som en svamp.",
         "Kompakt ben dominerar i rörbenens skaft och i ytterskiktet av korta, platta och oregelbundna ben. Spongiöst ben fyller rörbenens ändar och de inre delarna av övriga ben.",
         "Benvävnad är levande och byggs ständigt om. Osteoblaster bygger ny vävnad; osteoklaster bryter ned befintlig.",
         "Under barn- och ungdomsåren går uppbyggnaden snabbare än nedbrytningen och benen växer. Hos vuxna balanserar de varandra, så benet behåller sin storlek men förnyas hela tiden.",
         "Att skelettet är levande vävnad är skälet till att belastning stärker det och att inaktivitet försvagar det."] },
    en:{ t:"Bone tissue",
      s:"Living tissue, constantly rebuilt",
      p:["Every bone contains two kinds of bone tissue. The outer layer is compact bone, dense and smooth. Inside lies cancellous bone, porous like a sponge.",
         "Compact bone dominates the shafts of long bones and the outer layers of short, flat and irregular bones. Cancellous bone fills the ends of long bones and the interior of the others.",
         "Bone tissue is alive and continuously remodelled. Osteoblasts build new tissue; osteoclasts break down existing tissue.",
         "During childhood and adolescence building outpaces breakdown and bones grow. In adults the two balance, so a bone keeps its size while being renewed throughout life.",
         "Because bone is living tissue, loading strengthens it and inactivity weakens it."] } },

  { id:"leder", regions:[],
    sv:{ t:"Brosk och leder",
      s:"Där benen möts",
      p:["Brosk är en tät bindväv som stödjer och dämpar stötar. Det saknar både blodkärl och nerver, vilket är en orsak till att broskskador läker långsamt.",
         "Fiberbrosk finns i menisker och mellankotskivor. Hyalint brosk klär ledytor och förbinder revben med bröstbenet. Elastiskt brosk finns i ytterörat och struplocket.",
         "Leder kan klassificeras efter rörlighet: orörliga, något rörliga och fritt rörliga.",
         "De kan också klassificeras efter byggnad. Fibrösa leder hålls samman av bindväv och rör sig knappt; kraniets suturer är exempel. Broskleder förbinds av brosk och tillåter viss rörelse, som blygdbenssymfysen.",
         "Synoviala leder är fritt rörliga. Ledytorna täcks av ledbrosk, hålls samman av ligament och omsluts av en ledkapsel med synovialhinna. Hit hör de flesta leder i armar och ben.",
         "Alla ben i kroppen ledar mot ett annat ben utom tungbenet, som i stället är upphängt i muskler och ligament."] },
    en:{ t:"Cartilage and joints",
      s:"Where bones meet",
      p:["Cartilage is a dense connective tissue that supports and absorbs shock. It has neither blood vessels nor nerves, which is one reason cartilage injuries heal slowly.",
         "Fibrocartilage occurs in the menisci and intervertebral discs. Hyaline cartilage covers joint surfaces and connects the ribs to the sternum. Elastic cartilage is found in the outer ear and epiglottis.",
         "Joints can be classified by movement: immovable, slightly movable and freely movable.",
         "They can also be classified by structure. Fibrous joints are bound by connective tissue and barely move; the cranial sutures are examples. Cartilaginous joints are joined by cartilage and allow slight movement, such as the pubic symphysis.",
         "Synovial joints are freely movable. The surfaces are covered by articular cartilage, bound by ligaments and enclosed in a capsule lined with synovial membrane. Most joints of the arms and legs are of this kind.",
         "Every bone articulates with another bone except the hyoid, which is instead suspended by muscles and ligaments."] } }
];

<script>
// Joints as first-class objects, and the classic bone-type / rib groupings.
// Every id in `bones` must exist in bones.js — the build gate checks this.
window.JOINTS = [
  { id:"axel", bones:["FMA13396","FMA13395","FMA13323","FMA13322","FMA23131","FMA23130"],
    sv:{ t:"Axelleden", s:"Articulatio humeri · kulled",
      p:["Axelleden bildas av överarmsbenets huvud och skulderbladets ledskål.",
         "Ledskålen är grund och täcker bara en liten del av ledhuvudet. Det ger kroppens största rörelseomfång, men gör också leden till den mest luxationsbenägna.",
         "Stabiliteten kommer därför mer från muskler och ligament än från benens form. Rotatorkuffen håller ledhuvudet centrerat i ledskålen.",
         "Nyckelbenet är armens enda benförbindelse till bålen och ledar mot bröstbenet framtill."] },
    en:{ t:"The shoulder joint", s:"Articulatio humeri · ball and socket",
      p:["The shoulder joint is formed by the head of the humerus and the glenoid cavity of the scapula.",
         "The socket is shallow and covers only a small part of the head. This gives the body's greatest range of movement, but also makes it the joint most prone to dislocation.",
         "Stability therefore comes more from muscles and ligaments than from bone shape. The rotator cuff keeps the head centred in the socket.",
         "The clavicle is the arm's only bony connection to the trunk, articulating with the sternum anteriorly."] } },

  { id:"armbage", bones:["FMA23131","FMA23130","FMA23465","FMA23464","FMA23468","FMA23467"],
    sv:{ t:"Armbågsleden", s:"Articulatio cubiti · gångjärn + vridning",
      p:["Armbågen är egentligen tre leder i en gemensam ledkapsel, mellan överarmsben, armbågsben och strålben.",
         "Böjning och sträckning sker främst mellan överarmsbenet och armbågsbenet, som fungerar som ett gångjärn.",
         "Vridningen av underarmen — pronation och supination — sker när strålbenet roterar kring armbågsbenet.",
         "Armbågsbenet ligger på lillfingersidan och strålbenet på tumsidan. Vid supination ligger benen parallellt, vid pronation korsar de varandra."] },
    en:{ t:"The elbow joint", s:"Articulatio cubiti · hinge plus rotation",
      p:["The elbow is really three joints inside one capsule, between the humerus, ulna and radius.",
         "Flexion and extension occur mainly between the humerus and ulna, working as a hinge.",
         "Rotation of the forearm — pronation and supination — occurs as the radius turns around the ulna.",
         "The ulna lies on the little-finger side and the radius on the thumb side. In supination the bones lie parallel; in pronation they cross."] } },

  { id:"handled", bones:["FMA23465","FMA23464","FMA23468","FMA23467","FMA24436","FMA24435","FMA24438","FMA24437","FMA24440","FMA24439","FMA24442","FMA24441"],
    sv:{ t:"Handleden", s:"Articulatio radiocarpea · äggled",
      p:["Handleden bildas mellan strålbenets nedre ände och den proximala raden av handlovsben.",
         "Strålbenet bär huvuddelen av lasten. Armbågsbenet når inte fram till handlovsbenen utan skiljs från dem av en broskskiva.",
         "Båtbenet är det handlovsben som oftast frakturerar vid fall mot utsträckt hand, och det läker långsamt på grund av sin blodförsörjning.",
         "Rörelserna är böjning, sträckning och sidoböjning åt radial- respektive ulnarsidan."] },
    en:{ t:"The wrist joint", s:"Articulatio radiocarpea · condyloid",
      p:["The wrist joint forms between the lower end of the radius and the proximal row of carpal bones.",
         "The radius carries most of the load. The ulna does not reach the carpals, being separated from them by a cartilage disc.",
         "The scaphoid is the carpal most often fractured in a fall on an outstretched hand, and it heals slowly because of its blood supply.",
         "Movements are flexion, extension and deviation towards the radial and ulnar sides."] } },

  { id:"hoft", bones:["FMA16586","FMA16587","FMA24475","FMA24474"],
    sv:{ t:"Höftleden", s:"Articulatio coxae · kulled",
      p:["Höftleden bildas av lårbenshuvudet och höftskålen i bäckenbenet.",
         "Till skillnad från axeln är ledskålen djup och omsluter en stor del av ledhuvudet. Leden byter rörlighet mot stabilitet — den bär hela kroppsvikten.",
         "Höftskålen bildas där tarmben, sittben och blygdben möts. Hos barn är de ännu inte sammanvuxna.",
         "Lårbenshalsen är en vanlig frakturlokal hos äldre, eftersom benvävnaden där tunnas ut vid osteoporos."] },
    en:{ t:"The hip joint", s:"Articulatio coxae · ball and socket",
      p:["The hip joint is formed by the head of the femur and the acetabulum of the hip bone.",
         "Unlike the shoulder, the socket is deep and encloses much of the head. The joint trades mobility for stability — it carries the whole body weight.",
         "The acetabulum forms where the ilium, ischium and pubis meet. In children these are not yet fused.",
         "The femoral neck is a common fracture site in the elderly, because bone tissue there thins with osteoporosis."] } },

  { id:"kna", bones:["FMA24475","FMA24474","FMA24487","FMA24486","FMA24478","FMA24477","FMA24481","FMA24480"],
    sv:{ t:"Knäleden", s:"Articulatio genus · kroppens största led",
      p:["Knäleden är kroppens största led och bildas mellan lårbenet och skenbenet, med knäskålen framtill.",
         "Vadbenet ingår inte i själva knäleden utan ledar separat mot skenbenet strax nedanför.",
         "Två menisker av fiberbrosk fördelar trycket och ökar kontaktytan mellan lårben och skenben.",
         "Korsbanden stabiliserar leden framåt och bakåt, sidoledbanden i sidled. Knäet är därför stabilt i extension men sårbart för vridvåld i lätt böjt läge."] },
    en:{ t:"The knee joint", s:"Articulatio genus · the body's largest joint",
      p:["The knee is the body's largest joint, formed between the femur and the tibia, with the patella in front.",
         "The fibula is not part of the knee joint proper; it articulates separately with the tibia just below.",
         "Two menisci of fibrocartilage spread the load and increase the contact area between femur and tibia.",
         "The cruciate ligaments stabilise the joint front to back and the collateral ligaments side to side. The knee is therefore stable in extension but vulnerable to twisting when slightly flexed."] } },

  { id:"fotled", bones:["FMA24478","FMA24477","FMA24481","FMA24480","FMA24483","FMA24482","FMA24498","FMA24497"],
    sv:{ t:"Fotleden", s:"Articulatio talocruralis · gångjärn",
      p:["Den övre fotleden bildas mellan skenben, vadben och språngben.",
         "Skenbenet och vadbenet bildar en tång kring språngbenet. Vadbenets nedre ände är den yttre fotknölen, skenbenets den inre.",
         "Leden tillåter i huvudsak dorsalflexion och plantarflexion.",
         "Vridningen av foten inåt och utåt sker inte här utan i lederna under språngbenet, mot hälbenet och båtbenet."] },
    en:{ t:"The ankle joint", s:"Articulatio talocruralis · hinge",
      p:["The upper ankle joint forms between the tibia, fibula and talus.",
         "The tibia and fibula form a mortise around the talus. The lower end of the fibula is the lateral malleolus, that of the tibia the medial malleolus.",
         "The joint allows mainly dorsiflexion and plantarflexion.",
         "Turning the foot inwards and outwards happens not here but in the joints below the talus, against the calcaneus and navicular."] } },

  { id:"kakled", bones:["FMA52748","FMA52739","FMA52738"],
    sv:{ t:"Käkleden", s:"Articulatio temporomandibularis",
      p:["Käkleden bildas mellan underkäken och tinningbenet.",
         "Underkäken är skallens enda ben med en fritt rörlig led — alla andra skallben hålls samman av orörliga suturer.",
         "En broskskiva delar leden i två våningar. Det gör att käken både kan glida framåt och rotera.",
         "Leden arbetar alltid på båda sidor samtidigt, eftersom underkäken är ett enda ben."] },
    en:{ t:"The jaw joint", s:"Articulatio temporomandibularis",
      p:["The jaw joint forms between the mandible and the temporal bone.",
         "The mandible is the only skull bone with a freely movable joint — all other skull bones are held by immobile sutures.",
         "A cartilage disc divides the joint into two compartments, letting the jaw both glide forward and rotate.",
         "The joint always works on both sides at once, because the mandible is a single bone."] } },

  { id:"kotled", bones:["FMA12519","FMA12520","FMA12521","FMA12522","FMA12523","FMA12524","FMA12525"],
    sv:{ t:"Halskotpelaren", s:"Atlas, axis och kotlederna",
      p:["De två översta halskotorna är byggda helt annorlunda än de övriga.",
         "Atlas, den första halskotan, saknar kotkropp och bär upp skallen. Leden mot nackbenet står för nickrörelsen.",
         "Axis, den andra halskotan, har en tapp som atlas roterar kring. Den leden står för större delen av huvudets vridning.",
         "Övriga kotor förbinds av mellankotskivor av fiberbrosk plus småleder baktill. Varje enskild led rör sig lite, men summan ger ryggraden dess rörlighet."] },
    en:{ t:"The cervical spine", s:"Atlas, axis and the vertebral joints",
      p:["The top two cervical vertebrae are built quite differently from the rest.",
         "The atlas, the first cervical vertebra, has no body and carries the skull. Its joint with the occipital bone produces nodding.",
         "The axis, the second, has a peg around which the atlas rotates. That joint provides most of the head's turning.",
         "The remaining vertebrae are joined by fibrocartilage discs plus small facet joints behind. Each joint moves a little; the sum gives the spine its mobility."] } }

  function t(key, vars){
    var lang = STRINGS[settings.ui] ? settings.ui : "sv";
    var str = STRINGS[lang][key];
    if (str == null){ str = STRINGS.sv[key]; }
    if (str == null){ return key; }
    if (vars){
      for (var k in vars){
        if (Object.prototype.hasOwnProperty.call(vars, k)){
          str = str.replace("{" + k + "}", vars[k]);
        }
      }
    }
    return str;
  }

  function applyI18n(){
    var els = document.querySelectorAll("[data-i18n]");
    for (var i = 0; i < els.length; i++){
      els[i].textContent = t(els[i].getAttribute("data-i18n"));
    }
    var ph = document.querySelectorAll("[data-i18n-ph]");
    for (var j = 0; j < ph.length; j++){
      ph[j].setAttribute("placeholder", t(ph[j].getAttribute("data-i18n-ph")));
    }
    document.documentElement.setAttribute("lang", settings.ui === "en" ? "en" : "sv");
  }

  function regionName(r){ return t("region." + r) || r; }

  // Facts are bundled as { sv:[...], en:[...] }. Follow the UI language, and
  // fall back to Swedish (the reviewed source) if an English list is ever missing.
  function factList(b){
    if (!b.facts){ return []; }
    if (Array.isArray(b.facts)){ return b.facts; }   // legacy shape, defensive
    var arr = b.facts[settings.ui] || b.facts.sv || [];
    return arr;
  }

  var THEME = {
    // The skeleton illustration is a fixed image with light-yellow bones in BOTH
    // themes, so the selection wash must be dark in both or it vanishes on the bone
    // (the old dark-theme orange measured 1.3:1 against bone — effectively invisible).
    light:{ fill:"#f7f1e3", stroke:"#4a4335", selFill:"#8a5a06", selStroke:"#fff8e6", weight:0.9, selWeight:2.6 },
    dark: { fill:"#33302a", stroke:"#cfc6b2", selFill:"#8a5a06", selStroke:"#fff8e6", weight:0.9, selWeight:2.6 }
  };

  var BONES = window.BONES || [];
  var byId = {};
  for (var i = 0; i < BONES.length; i++){ byId[BONES[i].id] = BONES[i]; }

  var map = null, layersById = {}, mapInited = false, onPolyClickRef = null;
  var view = "front";              // "front" | "back"
  var skeletonLayer = null;
  // Each bone carries a polygon set per view. Bones not visible in a view
  // (sternum from behind, occipital from the front) simply have none there.
  // Four views now: the body plates (front/back) and the FOOT detail plates
  // (dorsal/lateral). Foot polygons live in foot.js, keyed by the same FMA id.
  var FOOTV = window.FOOT_VIEWS || {};
  function isFootView(){ return view === "footD" || view === "footL"; }
  function footKey(){ return (view === "footL") ? "lateral" : "dorsal"; }
  function footData(){ return FOOTV[footKey()] || { w:1, h:1, polys:{}, taps:{} }; }
  function vPolys(b){
    if (!b){ return []; }
    if (isFootView()){ return footData().polys[b.id] || []; }
    return (view === "back") ? (b.polysB || []) : (b.polys || []);
  }
  // Foot outlines are traced straight from the render's per-bone id buffer, so
  // every ring is a true silhouette — same contract as trueOutline on the body.
  function vTrueOutline(b){
    if (isFootView()){ return true; }
    return !!(b && (view === "back" ? b.trueOutlineB : b.trueOutline));
  }
  function vTaps(b){
    if (isFootView()){ return footData().taps[b.id] || null; }
    return (view === "back") ? b.tapsB : b.taps;
  }
  function vTapArea(b){
    if (isFootView()){ return null; }
    return (view === "back") ? b.tapAreaB : b.tapArea;
  }

  function viewLabelKey(){
    if (view === "footD"){ return "view.dorsal"; }
    if (view === "footL"){ return "view.lateral"; }
    return (view === "back") ? "view.back" : "view.front";
  }
  // Each plate is rendered at its own NATIVE resolution (no resampling), so the two
  // views have different canvas sizes and the map bounds change when you flip.
  function vBounds(){
    if (isFootView()){ var fd = footData(); return [[0, 0], [fd.h, fd.w]]; }
    return (view === "back")
      ? [[0, 0], [window.IMG_H_B, window.IMG_W_B]]
      : [[0, 0], [window.IMG_H, window.IMG_W]];
  }
  function vAnchors(b){
    if (isFootView()){ return []; }
    return (view === "back") ? (b.anchorsB || []) : (b.anchors || []);
  }
  var selectedId = null;
  var studied = {};
  var toastTimer = null;
  var APP_VERSION = "5.2.1";
  var settings = { theme:"auto", primary:"sv", ui:"sv" };
  var resetArmed = false;

  function systemDark(){
    try { return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches); }
    catch (e) { return false; }
  }
  function isDark(){
    if (settings.theme === "dark"){ return true; }
    if (settings.theme === "light"){ return false; }
    return systemDark();
  }
  function palette(){ return isDark() ? THEME.dark : THEME.light; }

  // ---------- storage (guarded: file:// localStorage is unreliable on old WebViews) ----------
  function loadStudied(){
    try {
      var raw = window.localStorage.getItem("ba_studied");
      if (raw){ studied = JSON.parse(raw) || {}; }
    } catch (e) { studied = {}; }
  }
  function saveStudied(){
    try { window.localStorage.setItem("ba_studied", JSON.stringify(studied)); }
    catch (e) { /* in-memory only; not fatal */ }
  }

  function loadSettings(){
    try {
      var raw = window.localStorage.getItem("ba_settings");
      if (raw){
        var o = JSON.parse(raw) || {};
        if (o.theme === "auto" || o.theme === "light" || o.theme === "dark"){
          settings.theme = o.theme;
        }
        if (o.primary === "sv" || o.primary === "la" || o.primary === "en"){
          settings.primary = o.primary;
        }
        if (o.ui === "sv" || o.ui === "en"){ settings.ui = o.ui; }
      }
    } catch (e) { /* defaults stand */ }
  }
  function saveSettings(){
    try { window.localStorage.setItem("ba_settings", JSON.stringify(settings)); }
    catch (e) { /* in-memory only */ }
  }

  // Manual theme wins over the media query: html.t-dark has higher specificity
  // than :root, so this works regardless of stylesheet order.
  function applyTheme(){
    var el = document.documentElement;
    var cls = (el.className || "").replace(/\s*t-(light|dark)\b/g, "");
    if (settings.theme === "dark"){ cls += " t-dark"; }
    else if (settings.theme === "light"){ cls += " t-light"; }
    el.className = cls.replace(/^\s+/, "");
    for (var id in layersById){
      if (Object.prototype.hasOwnProperty.call(layersById, id)){ applyStyle(id); }
    }
  }

  // ---- name ordering follows the language setting ----
  function digitSuffix(b){
    if (!b || !b.polyDigit) { return ""; }
    var d = b.polyDigit[selectedSide];
    if (!d) { return ""; }
    return "  \u00b7 dig. " + ["I","II","III","IV","V"][d - 1];
  }

  function names(b){
    var order = settings.primary === "la" ? ["la","sv","en"]
              : settings.primary === "en" ? ["en","sv","la"]
              : ["sv","la","en"];
    return { first:b[order[0]], second:b[order[1]], third:b[order[2]],
             firstIsLatin:order[0] === "la", secondIsLatin:order[1] === "la" };
  }

  // ---------- NAVIGATION (explicit user actions only) ----------
  function goToPage(pageId){
    var pages = document.querySelectorAll(".page");
    for (var i = 0; i < pages.length; i++){
      pages[i].className = "page" + (pages[i].id === pageId ? " active" : "");
    }
    // MER stays lit while you are inside any of its sub-pages
    var MER_PAGES = { "page-mer":1, "page-settings":1, "page-about":1, "page-guide":1, "page-guide-article":1, "page-joints":1 };
    var btns = document.querySelectorAll(".nav-btn[data-page]");
    for (var j = 0; j < btns.length; j++){
      var t = btns[j].getAttribute("data-page");
      var on = (t === pageId) || (t === "page-mer" && MER_PAGES[pageId] === 1);
      btns[j].className = "nav-btn" + (on ? " active" : "");
    }
    if (pageId === "page-atlas" && map){
      window.setTimeout(function(){ map.invalidateSize(); }, 0);
    }
    // navigating away abandons any in-progress round (overlay lives on the atlas)
    if (pageId !== "page-atlas" && quiz){ endQuiz(); }
    if (pageId === "page-mina"){ renderMina(); }
    if (pageId === "page-bone"){ renderBrowse(); }
    if (pageId === "page-mer"){ renderMer(); }
    if (pageId === "page-settings"){ renderSettings(); }
    if (pageId === "page-guide"){ renderGuide(); }
    if (pageId === "page-joints"){ renderJoints(); }
    if (pageId === "page-about"){ renderAbout(); }
  }

  function showToast(msg){
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.className = "show";
    if (toastTimer){ window.clearTimeout(toastTimer); }
    toastTimer = window.setTimeout(function(){ el.className = ""; }, 2400);
  }

  // ---------- STATE ----------
  var HIDDEN_STYLE = { color: "#000", weight: 0, opacity: 0, fillColor: "#fff",
                       fillOpacity: 0.01, lineJoin: "round", lineCap: "round" };

  function styleFor(id){
    if (DEBUG_HITS){
      var b0 = byId[id];
      return { color: id === selectedId ? "#f00" : "#09f", weight: 1, opacity: 0.9,
               fill: true, fillColor: "#09f", fillOpacity: id === selectedId ? 0.35 : 0.08 };
    }
    var p = palette();
    if (id === null || id === undefined){ return HIDDEN_STYLE; }
    var sel = (id === selectedId);
    var b = byId[id];
    // Pin bones (small clusters: carpals, phalanges, tiny facial bones) never fill
    // their polygon — a pin marker shows instead. Polygon stays invisible but tappable.
    if (b && b.pin){ return HIDDEN_STYLE; }
    // Large bones: invisible tap-target normally, translucent wash when selected.
    if (!sel){ return HIDDEN_STYLE; }
    return {
      color: p.selStroke,
      weight: p.selWeight,
      opacity: 1,
      fillColor: p.selFill,
      fillOpacity: 0.70,
      lineJoin: "round",
      lineCap: "round"
    };
  }

  var pinMarker = null;   // single reusable pin for small/clustered bones
  var polyHandled = false; // set by a polygon tap, consumed by the map tap handler
  var selectedSide = 0;   // which SIDE (0=left, 1=right) of the selected bone is active

  // A bone's polygons are horizontal scanline BANDS, not sides. The femur has 40
  // of them. Treating a band index as a side lit one 24px strip instead of the
  // bone. Map each band to a side so the whole bone lights, and a paired bone
  // still lights only the limb that was tapped.
  function bandSides(b){
    var VP = vPolys(b), n = VP.length, out = [], i, j;
    for (i = 0; i < n; i++){ out.push(0); }
    if (!b || b.side !== "paired" || n < 2){ return out; }
    var cx = [], lo = Infinity, hi = -Infinity;
    for (i = 0; i < n; i++){
      var mn = Infinity, mx = -Infinity;
      for (j = 0; j < VP[i].length; j++){
        if (VP[i][j][1] < mn){ mn = VP[i][j][1]; }
        if (VP[i][j][1] > mx){ mx = VP[i][j][1]; }
      }
      var c = (mn + mx) / 2;
      cx.push(c);
      if (c < lo){ lo = c; }
      if (c > hi){ hi = c; }
    }
    var mid = (lo + hi) / 2;
    for (i = 0; i < n; i++){ out[i] = (cx[i] < mid) ? 0 : 1; }
    return out;
  }

  // Bands belonging to the currently lit side.
  function litBands(b){
    var VP = vPolys(b), sides = bandSides(b), pick = [], i;
    if (vTrueOutline(b)){
      return (selectedSide >= 0 && selectedSide < VP.length) ? [VP[selectedSide]] : VP;
    }
    for (i = 0; i < VP.length; i++){
      if ((i < sides.length ? sides[i] : 0) === selectedSide){ pick.push(VP[i]); }
    }
    return pick.length ? pick : VP;
  }

  // Pin at the centre of the MIDDLE band of the lit side. A centroid can fall off
  // a curved bone (a rib); the middle band's centre is always on it. Derived from
  // the same bands that are lit, so pin and highlight can never disagree.
  function pinPoint(b){
    var pick = litBands(b), i;
    if (!pick.length){ return null; }
    var mid = [];
    for (i = 0; i < pick.length; i++){
      var ys = pick[i], mny = Infinity, mxy = -Infinity, mnx = Infinity, mxx = -Infinity;
      for (var j = 0; j < ys.length; j++){
        if (ys[j][0] < mny){ mny = ys[j][0]; }
        if (ys[j][0] > mxy){ mxy = ys[j][0]; }
        if (ys[j][1] < mnx){ mnx = ys[j][1]; }
        if (ys[j][1] > mxx){ mxx = ys[j][1]; }
      }
      mid.push([(mny + mxy) / 2, (mnx + mxx) / 2]);
    }
    mid.sort(function(p, q){ return p[0] - q[0]; });
    return mid[Math.floor(mid.length / 2)];
  }

  function updatePin(){
    var b = byId[selectedId];
    if (!map){ return; }
    var anchors = b ? vAnchors(b) : null;
    if (b && b.pin && (anchors && anchors.length || vPolys(b).length)){
      var p = palette();
      var a = pinPoint(b) || anchors[Math.min(selectedSide, anchors.length - 1)];
      var latlng = [a[0], a[1]];
      if (!pinMarker){
        pinMarker = L.circleMarker(latlng, {
          radius: 9, weight: 3, color: p.selStroke,
          fillColor: p.selFill, fillOpacity: 1, opacity: 1,
          interactive: false, className: "bone-pin"
        }).addTo(map);
      } else {
        pinMarker.setLatLng(latlng);
        pinMarker.setStyle({ color: p.selStroke, fillColor: p.selFill });
        if (!map.hasLayer(pinMarker)){ pinMarker.addTo(map); }
      }
    } else if (pinMarker && map.hasLayer(pinMarker)){
      map.removeLayer(pinMarker);
    }
  }

  function applyStyle(id){
    var arr = layersById[id];
    var sel = (id === selectedId);
    var b = byId[id];
    if (arr){
      var hidden = styleFor(null);          // the invisible tap-target style
      var lit = styleFor(id);
      var sides = bandSides(b);
      var single = vTrueOutline(b);
      for (var i = 0; i < arr.length; i++){
        if (!arr[i].setStyle) { continue; }
        if (single){ arr[i].setStyle(sel && i === selectedSide ? lit : hidden); continue; }
        // Only the tapped side lights up. A paired bone (tibia, femur) must not
        // highlight both legs for one answer — the exam points at ONE bone.
        var isActiveSide = sel && ((i < sides.length ? sides[i] : 0) === selectedSide);
        arr[i].setStyle(isActiveSide ? lit : hidden);
      }
    }
    // Must run even when this bone has no layers in the current view, otherwise
    // the pin is left behind on the PREVIOUS selection and reads as a wrong answer.
    updatePin();
  }

  // A tap that lands on no hit area used to do nothing at all, leaving the last
  // bone and its pin on screen — indistinguishable from the app pointing at the
  // wrong bone. Clearing is honest: it shows the tap did not land.
  function clearSelection(){
    var prev = selectedId;
    if (!prev){ return; }
    selectedId = null;
    selectedSide = 0;
    applyStyle(prev);
    if (pinMarker && map && map.hasLayer(pinMarker)){ map.removeLayer(pinMarker); }
    renderStrip();
  }

  function selectBone(id, sideIdx){
    if (!byId[id]) { return; }
    var prev = selectedId;
    selectedId = id;
    // sideIdx arrives as the index of the tapped BAND; convert it to a side.
    var bsel = byId[id];
    if (bsel && vTrueOutline(bsel)){
      // Each outline IS one real bone. Ten fingertips share the id
      // "phalanges-dist-hand", so lighting the whole id lit every fingertip on
      // that hand - which looked exactly like the wrong finger being selected.
      selectedSide = (typeof sideIdx === "number" && sideIdx >= 0) ? sideIdx : 0;
    } else {
      var sides = bandSides(bsel);
      selectedSide = (typeof sideIdx === "number" && sideIdx >= 0 && sideIdx < sides.length)
        ? sides[sideIdx] : 0;
    }
    if (prev && prev !== id){ applyStyle(prev); }
    applyStyle(id);
    renderStrip();
  }

  function renderStrip(){
    var strip = document.getElementById("sel-strip");
    // never show the strip during a quiz: the quiz borrows selectedId to highlight
    // the target bone, but the strip must stay hidden behind the overlay
    if (quiz){ strip.className = ""; return; }
    var b = byId[selectedId];
    if (!b){ strip.className = ""; return; }
    var n = names(b);
    var svEl = document.getElementById("sel-sv");
    var laEl = document.getElementById("sel-la");
    svEl.textContent = n.first + digitSuffix(b);
    svEl.style.fontStyle = n.firstIsLatin ? "italic" : "normal";
    laEl.textContent = n.second;
    laEl.style.fontStyle = n.secondIsLatin ? "italic" : "normal";
    // third name: the sheet always shows Latin, Swedish and English together
    var enEl = document.getElementById("sel-en");
    if (enEl){
      var shown = { }, third = "", thirdLatin = false;
      shown[n.first] = 1; shown[n.second] = 1;
      var trio = [ [b.la, true], [b.sv, false], [b.en, false] ];
      for (var ti = 0; ti < trio.length; ti++){
        if (trio[ti][0] && !shown[trio[ti][0]]){ third = trio[ti][0]; thirdLatin = trio[ti][1]; break; }
      }
      enEl.textContent = third || "";
      enEl.style.fontStyle = thirdLatin ? "italic" : "normal";
    }
    var metaEl = document.getElementById("sel-meta");
    if (metaEl){
      metaEl.innerHTML = "";
      var rc = document.createElement("span");
      rc.className = "sheet-chip";
      rc.textContent = regionName(b.region);
      metaEl.appendChild(rc);
      if (b.cls === "cartilage"){
        var wc = document.createElement("span");
        wc.className = "sheet-chip warn";
        wc.textContent = t("sheet.unverified");
        metaEl.appendChild(wc);
      }
    }
    strip.className = "show";
  }

  // ---------- MAP ----------
